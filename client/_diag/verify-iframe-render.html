<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>sanitize v1.10 — iframe 实际渲染验证</title>
<script src="/client/lib/dompurify.min.js?v=3.0"></script>
<script src="/client/js/utils/sanitize-email.js?v=1.10"></script>
<style>
body { font-family: Consolas, monospace; padding: 12px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.col h3 { margin: 4px 0; }
iframe { width: 100%; min-height: 700px; border: 1px solid #888; background: #fff; }
pre { background: #f4f4f4; padding: 8px; max-height: 260px; overflow: auto; font-size: 11px; }
.warn { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<h1>招商证券对账单 — 修复后 iframe 实际渲染</h1>
<div class="row">
  <div class="col">
    <h3>左侧：iframe 内真实渲染（用户看到的样子）</h3>
    <iframe id="ifr"></iframe>
  </div>
  <div class="col">
    <h3>右侧：DOMPurify 过滤后的原始 HTML（诊断）</h3>
    <pre id="raw"></pre>
    <h3>关键检查点</h3>
    <pre id="checks"></pre>
  </div>
</div>
<script>
(async function () {
  const KEY = 'dev-key-001';
  const res = await fetch('/api/emails/3339?mailbox=INBOX', { headers: { 'x-api-key': KEY } });
  const email = await res.json();
  const html = email.html;
  const sanitized = window.EmailSanitize.sanitizeEmailHtmlForIframe(html, email);

  // 1) iframe 真实渲染
  const ifr = document.getElementById('ifr');
  ifr.contentDocument.open();
  ifr.contentDocument.write(sanitized);
  ifr.contentDocument.close();

  // 2) 关键检查
  const checks = [];
  checks.push('style 标签数: ' + (sanitized.match(/<style[^>]*>/g) || []).length);
  checks.push('table 标签数: ' + (sanitized.match(/<table/g) || []).length);
  checks.push('th 标签数: ' + (sanitized.match(/<th/g) || []).length);
  checks.push('img 标签数: ' + (sanitized.match(/<img/g) || []).length);
  checks.push('img 有 src: ' + (sanitized.match(/<img[^>]*src=/g) || []).length);
  checks.push('含 background-color: ' + (sanitized.match(/background-color/g) || []).length);
  checks.push('含 #c00403: ' + (sanitized.match(/#c00403/g) || []).length);
  checks.push('含 font-size: ' + (sanitized.match(/font-size/g) || []).length);
  checks.push('含 nth-child: ' + (sanitized.match(/nth-child/g) || []).length);
  checks.push('含 table1x: ' + (sanitized.match(/table1x/g) || []).length);
  // 抽出第一个 <style> 标签看实际内容
  const styleMatch = sanitized.match(/<style[^>]*>([\s\S]*?)<\/style>/);
  if (styleMatch) {
    checks.push('\n=== 第一个 <style> 标签内容 ===');
    checks.push(styleMatch[1].slice(0, 1200));
  }
  document.getElementById('checks').textContent = checks.join('\n');
  document.getElementById('raw').textContent = sanitized.slice(0, 5000);
})();
</script>
</body>
</html>
