<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GenOffice Sheets Host</title>
<link rel="stylesheet" href="/client/lib/office-v3/sheets-ui/acms-office-sheets-ui.css?v=26">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  /* P140: ACMS 顶部小工具条（GenOffice Sheets UI 不带「打开…」按钮） */
  .acms-sheets-toolbar{
    height:32px;display:flex;align-items:center;gap:8px;
    padding:0 12px;background:#f5f5f7;border-bottom:1px solid #d8d8de;
    flex-shrink:0;
  }
  .acms-sheets-toolbar button{
    font-size:12px;padding:4px 12px;border:1px solid #ccc;border-radius:4px;
    background:#fff;cursor:pointer;color:#333;
  }
  .acms-sheets-toolbar button:hover{background:#eaecef;}
  .acms-sheets-toolbar button:disabled{opacity:.5;cursor:wait;}
  .acms-sheets-toolbar .sep{width:1px;height:18px;background:#d8d8de;margin:0 4px;}
  .acms-sheets-toolbar .name{font-size:12px;color:#666;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #root{height:calc(100vh - 32px);}
</style>
</head>
<body>
<div class="acms-sheets-toolbar">
  <button data-role="open-file" title="从本地选择 .xlsx 文件打开">📂 打开…</button>
  <button data-role="save-file" title="把当前工作簿另存为新 xlsx 文件（Ctrl+S）">💾 保存</button>
  <span data-role="dirty-flag" style="display:none;font-size:11px;color:#c33;">● 未保存</span>
  <div class="sep"></div>
  <div class="name" data-role="file-name">未打开文件</div>
</div>
<div id="root"></div>
<script>
  // iframe console 转发到主窗口（调试）
  ;['log', 'error', 'warn'].forEach(function (lv) {
    var orig = console[lv];
    console[lv] = function () {
      var parts = Array.prototype.map.call(arguments, function (x) {
        if (typeof x === 'string') return x;
        try { return JSON.stringify(x); } catch (e) { return String(x); }
      });
      try { parent.postMessage({ type: 'iframe-console', level: lv, msg: parts.join(' ').slice(0, 500) }, '*'); } catch (e) {}
      orig.apply(console, arguments);
    };
  });
  // process polyfill
  if (!window.process) {
    window.process = {
      env: { NODE_ENV: 'production' },
      platform: 'win32',
      arch: 'x64',
      versions: {},
      nextTick: function (fn) { setTimeout(fn, 0); },
      cwd: function () { return '/'; },
    };
  }
  // Buffer polyfill（jszip/引擎可能引用 Node Buffer）
  if (typeof window.Buffer === 'undefined') {
    var TextDecoderU8 = window.TextDecoder;
    var u8ToString = Uint8Array.prototype.toString;
    Uint8Array.prototype.toString = function (enc) {
      if (enc === 'utf8' || enc === 'utf-8' || enc === undefined) {
        try { return new TextDecoderU8().decode(this); } catch (e) { return u8ToString.call(this); }
      }
      if (enc === 'base64') {
        // P138: 补 base64 分支（media resolver / save 链路用 Buffer.from(bytes).toString('base64')）
        var CHUNK = 0x8000, s = '';
        for (var i = 0; i < this.length; i += CHUNK) {
          s += String.fromCharCode.apply(null, this.subarray(i, i + CHUNK));
        }
        return btoa(s);
      }
      return u8ToString.call(this);
    };
    var BufferPoly = function (arg) {
      if (typeof arg === 'string') return new TextEncoder().encode(arg);
      if (arg instanceof Uint8Array) return arg;
      if (typeof arg === 'number') return new Uint8Array(arg);
      return new Uint8Array(0);
    };
    BufferPoly.from = function (arg) { return BufferPoly(arg); };
    BufferPoly.alloc = function (n) { return new Uint8Array(n); };
    BufferPoly.concat = function (list) {
      var total = list.reduce(function (s, x) { return s + x.length; }, 0);
      var out = new Uint8Array(total);
      var off = 0;
      list.forEach(function (x) { out.set(x, off); off += x.length; });
      return out;
    };
    BufferPoly.isBuffer = function (x) { return x instanceof Uint8Array && x._isACMSBuffer === true; };
    window.Buffer = BufferPoly;
  }
</script>
<script type="module">
  // iframe host：由父窗口（ACMS office-v3-bridge）调用 __init/__unmount
  let mod = null
  let rootEl = null

  window.__init = async function (opts) {
    opts = opts || {}
    try {
      if (!mod) mod = await import('/client/lib/office-v3/sheets-ui/office-sheets-ui.js?v=13')
      if (rootEl && mod.unmountSheetsUI) {
        try { mod.unmountSheetsUI(rootEl) } catch (e) {}
      }
      rootEl = document.getElementById('root')
      rootEl.innerHTML = ''
      let bin = null
      if (opts.fileId) {
        const dlName = encodeURIComponent(opts.fileName || '工作簿.xlsx')
        const resp = await fetch('/api/office/download/' + encodeURIComponent(opts.fileId) + '/' + dlName + '?api_key=' + (opts.apiKey || 'dev-key-001'))
        if (!resp.ok) throw new Error('下载文件失败 HTTP ' + resp.status)
        bin = new Uint8Array(await resp.arrayBuffer())
      }
      mod.mountSheetsUI(rootEl, {
        fileId: opts.fileId || undefined,
        fileName: opts.fileName || '工作簿.xlsx',
        apiKey: opts.apiKey || 'dev-key-001',
        buffer: bin || undefined,
      })
      // P144: 浏览器 stub 的 ai:get-settings 返回 {provider:"acms"} 没有 providers 字段，
      // Lu() 读 Be.providers[Be.provider] → undefined['acms'] → 每次按键报错。
      // window.desktopApi 是 mountSheetsUI 内部才赋值的，必须 mount 后 patch。
      // React useEffect 异步执行，mount 后同步 patch 来得及（Lu 在 onKeyDown 里调用）。
      try {
        if (window.desktopApi && !window.desktopApi.__acmsSettingsPatched) {
          window.desktopApi.getAiSettings = function () {
            return Promise.resolve({ provider: 'acms', apiKey: '', model: '', providers: { acms: { model: '' } } });
          };
          window.desktopApi.__acmsSettingsPatched = true;
        }
      } catch (e) { /* ignore */ }
      if (window.__setFileNameLabel) window.__setFileNameLabel(opts.fileName || (bin ? '工作簿.xlsx' : '未打开文件'))
      return { ok: true }
    } catch (e) {
      console.error('[genoffice-sheets-host] __init 失败:', e)
      return { ok: false, error: e.message }
    }
  }

  window.__unmount = function () {
    try {
      if (rootEl && mod && mod.unmountSheetsUI) mod.unmountSheetsUI(rootEl)
    } catch (e) {}
    rootEl = null
  }

  // P140: ACMS 顶部「打开…」按钮（GenOffice Sheets UI 本身没有 Open 入口）
  // 流程：浏览器 file picker → POST /api/office/save 上传 → 拿 fileId → 重新跑 __init 替换工作簿
  function bytesToBase64(bytes) {
    var bs = new Uint8Array(bytes);
    var chunks = [];
    var CH = 0x8000;
    for (var i = 0; i < bs.length; i += CH) {
      chunks.push(String.fromCharCode.apply(null, bs.subarray(i, i + CH)));
    }
    return btoa(chunks.join(''));
  }
  function setFileNameLabel(name) {
    var el = document.querySelector('[data-role="file-name"]');
    if (el) el.textContent = name || '未打开文件';
  }
  function pickFile() {
    return new Promise(function (resolve) {
      try {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel';
        inp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
        document.body.appendChild(inp);
        var settled = false;
        function done(file) {
          if (settled) return;
          settled = true;
          try { inp.remove(); } catch (e) {}
          resolve(file || null);
        }
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          done(f);
        });
        // 用户取消 modern browser 关闭 dialog 不触发 change，靠 timeout 兜底
        setTimeout(function () { done(null); }, 10 * 60 * 1000);
        inp.click();
      } catch (e) {
        console.warn('[sheets-host] pickFile failed:', e);
        resolve(null);
      }
    });
  }
  // 上传本地 xlsx → 拿 fileId
  async function uploadXlsx(file, apiKey) {
    var b64 = bytesToBase64(await file.arrayBuffer());
    var resp = await fetch('/api/office/save?api_key=' + (apiKey || 'dev-key-001'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'xlsx', name: file.name || '工作簿.xlsx', content: b64 }),
    });
    var r = await resp.json();
    return r; // { ok, fileId?, error? }
  }

  // wire up the open-file button
  var _openBtn = document.querySelector('[data-role="open-file"]');
  if (_openBtn) {
    _openBtn.addEventListener('click', async function () {
      var apiKey = (window.__acmsApiKey) || 'dev-key-001';
      _openBtn.disabled = true;
      try {
        var file = await pickFile();
        if (!file) return;
        setFileNameLabel('上传中… ' + file.name);
        var r = await uploadXlsx(file, apiKey);
        if (!r || !r.ok) {
          setFileNameLabel('上传失败：' + ((r && r.error) || '未知'));
          alert('上传失败：' + ((r && r.error) || '未知'));
          return;
        }
        // 重新跑 __init 替换工作簿（__init 内部会 unmountSheetsUI + 清空 root + mount）
        await window.__init({ fileId: r.fileId, fileName: file.name, apiKey: apiKey });
        // 通知父窗口 ACMSWin 更新标题
        try { parent.postMessage({ type: 'acms-office-open', fileId: r.fileId, fileName: file.name }, '*'); } catch (e) {}
      } catch (e) {
        console.error('[sheets-host] open file failed:', e);
        setFileNameLabel('打开失败：' + (e.message || String(e)));
      } finally {
        _openBtn.disabled = false;
      }
    });
  }

  // ── ACMS 补丁 (v0.97.2)：前端补全 Excel 保存链路 ──────────────────────────────
  // 背景：GenOffice sheets-ui bundle 自身不暴露 saveXlsx；内部 desktopApi.saveWorkbookEdits
  //       是 Electron IPC stub（仅桌面版可用），浏览器下永远失败——applyPlan 写入 Univer 内存
  //       后没有任何方式把数据持久化。后端 /api/office/save 完整可用（接收 data:{sheets:[...]}），
  //       只需要前端从 Univer 提取当前工作簿内容 + POST 即可。
  // 实现：
  //   1) 工具栏"💾 保存"按钮 + Ctrl+S 拦截 → 调 saveXlsxNow()
  //   2) saveXlsxNow() 从 univerAPI 提取所有 sheet 的 name/headers/rows，调后端另存为新文件
  //   3) setDirtyFlag / clearDirtyFlag 通过 MutationObserver + applyPlan 触发，状态栏"● 未保存"
  var _saveBtn = document.querySelector('[data-role="save-file"]');
  var _dirtyFlag = document.querySelector('[data-role="dirty-flag"]');
  var _hasUnsavedChanges = false;
  function setDirtyFlag() {
    _hasUnsavedChanges = true;
    if (_dirtyFlag) _dirtyFlag.style.display = '';
  }
  function clearDirtyFlag() {
    _hasUnsavedChanges = false;
    if (_dirtyFlag) _dirtyFlag.style.display = 'none';
  }
  function notifyDirtyToParent() {
    try { parent.postMessage({ type: 'acms-office-dirty', dirty: _hasUnsavedChanges }, '*'); } catch (e) {}
  }
  function showToast(msg, isError) {
    try {
      var tip = document.createElement('div');
      tip.textContent = msg;
      tip.style.cssText = 'position:fixed;top:50px;left:50%;transform:translateX(-50%);' +
        'padding:8px 16px;border-radius:4px;font-size:13px;z-index:99999;' +
        'background:' + (isError ? '#fee' : '#efe') + ';color:' + (isError ? '#c33' : '#363') + ';' +
        'border:1px solid ' + (isError ? '#fcc' : '#cec') + ';box-shadow:0 2px 8px rgba(0,0,0,.1);';
      document.body.appendChild(tip);
      setTimeout(function () { try { tip.remove(); } catch (e) {} }, 2500);
    } catch (e) {}
  }
  // 从当前 Univer 工作簿提取所有 sheet 数据 → 后端 writeXlsx 期望的 {name,headers,rows} 结构
  function extractWorkbookData() {
    var api = window.univerAPI || (window.__sheetsDebug && window.__sheetsDebug.univerAPI);
    if (!api) throw new Error('univerAPI 未挂载');
    var wb = api.getActiveWorkbook();
    if (!wb) throw new Error('当前没有打开的工作簿');
    var sheetsOut = [];
    var sheets = wb.getSheets() || [];
    for (var i = 0; i < sheets.length; i++) {
      var sheet = sheets[i];
      var name = sheet.getSheetName();
      var maxRow = sheet.getMaxRows();
      var maxCol = sheet.getMaxColumns();
      // getRange(startRow, startCol, endRow, endCol) —— Univer 是包含上下界
      var values;
      try {
        values = sheet.getRange(0, 0, Math.max(0, maxRow - 1), Math.max(0, maxCol - 1)).getValues() || [];
      } catch (e) {
        values = [];
      }
      var headers = (values[0] || []).map(function (v) {
        return v == null ? '' : String(v);
      });
      var rows = [];
      for (var r = 1; r < values.length; r++) {
        var rowArr = values[r] || [];
        var isEmpty = rowArr.every(function (c) { return c == null || c === ''; });
        if (!isEmpty) rows.push(rowArr.map(function (c) {
          return c == null ? '' : String(c);
        }));
      }
      sheetsOut.push({ name: name, headers: headers, rows: rows });
    }
    return { sheets: sheetsOut };
  }
  // 核心：另存当前工作簿为新文件
  var _saving = false;
  async function saveXlsxNow() {
    if (_saving) return;
    _saving = true;
    if (_saveBtn) _saveBtn.disabled = true;
    try {
      var apiKey = (window.__acmsApiKey) || 'dev-key-001';
      var data = extractWorkbookData();
      if (!data.sheets.length) {
        showToast('❌ 工作簿为空，无可保存内容', true);
        return;
      }
      // 文件名：原文件名-时间戳.xlsx（避免覆盖原文件 = 方案1"另存新文件"）
      var origName = (window.__acmsFileName) || '工作簿.xlsx';
      var baseName = origName.replace(/\.xlsx?$/i, '');
      var newName = baseName + '-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.xlsx';
      showToast('⏳ 正在保存…', false);
      var resp = await fetch('/api/office/save?api_key=' + apiKey, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'xlsx', name: newName, data: data }),
      });
      var r = await resp.json();
      if (r && r.ok) {
        clearDirtyFlag();
        notifyDirtyToParent();
        showToast('✅ 已保存 ' + newName + '（' + data.sheets.length + ' 个 sheet）', false);
        console.log('[sheets-host] save ok:', r);
      } else {
        showToast('❌ 保存失败：' + ((r && r.error) || '未知错误'), true);
        console.error('[sheets-host] save failed:', r);
      }
    } catch (e) {
      showToast('❌ 保存异常：' + (e.message || String(e)), true);
      console.error('[sheets-host] save exception:', e);
    } finally {
      _saving = false;
      if (_saveBtn) _saveBtn.disabled = false;
    }
  }
  if (_saveBtn) {
    _saveBtn.addEventListener('click', function () { saveXlsxNow(); });
  }
  // Ctrl+S / Cmd+S 全局拦截 → 保存（Univer 内部默认 Ctrl+S 会触发 desktopApi 静默失败，先 preventDefault 阻断）
  document.addEventListener('keydown', function (e) {
    var isSave = (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S');
    if (!isSave) return;
    e.preventDefault();
    e.stopPropagation();
    saveXlsxNow();
  }, true);
  // 暴露给 host.html 外部（AI runner.applyPlan 完成后调 markDirty）
  window.__markDirty = function () {
    setDirtyFlag();
    notifyDirtyToParent();
  };
  window.__clearDirty = function () {
    clearDirtyFlag();
    notifyDirtyToParent();
  };
  console.info('[sheets-host] v0.97.2 save-as-xlsx 补丁已装载（另存新文件）');

// 让外部（bridge / 上层）可以更新顶部文件名显示
  window.__setFileNameLabel = setFileNameLabel;

  // ── ACMS 补丁 (v0.96.x)：patch sheets-ui ACMS AI runner → ACMS Buddy ──────
  // 与 word-ui/host.html 的 patchACMS AIRunner 同款思路：
  //   sheets-ui 里 _Rn (line 331502) 是空 stub runner（和 Word 的 DX 同构）
  //   bo = useRef(null) (line 362203) 是 runner ref
  //   Pd(text, files) (line 362320) 是发送函数，调 pt.run(text, files)
  //   Wr = useState(!1) 的 setter（busy），Ri = useState([]) 的 setter（消息）
  //   面板 DOM class：.ai-panel-header / .ai-panel-title / .ai-header-btn
  function findAiPanelFiber(rootEl) {
    // 参照 Word 的 findGeeFiber：从 AI 面板 DOM 元素上溯整条 return 链，
    // 找持有 bo runner ref（useRef.current 是 _Rn 实例：空对象 + start/stop/send）的组件。
    // ⚠️ 不要停在第一个函数组件（nIn 是表现层，bo ref 在上层 OLn/ll 容器组件里）
    // ⚠️ OLn 有 80+ hooks，bo ref 在 hook 76（2026-08-16 实测），guard 必须 > 80
    var candidates = rootEl.querySelectorAll('.ai-panel-header, .ai-panel-title, .ai-header-btn, [class*="ai-panel-"]');
    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      var fiberKey = Object.keys(el).find(function(k) { return k.indexOf('__reactFiber') === 0; });
      if (!fiberKey) continue;
      var fiber = el[fiberKey];
      while (fiber) {
        if (fiber.tag === 0 || fiber.tag === 1) {
          // 检查该函数组件的 hook 链里是否有 _Rn 特征 ref
          var hook = fiber.memoizedState;
          var guard = 0;
          while (hook && guard < 100) {
            var ms = hook.memoizedState;
            if (ms && typeof ms === 'object' && 'current' in ms && !Array.isArray(ms)) {
              var c = ms.current;
              if (c && typeof c === 'object' && !Array.isArray(c) &&
                  typeof c.start === 'function' && typeof c.stop === 'function' && typeof c.send === 'function') {
                return fiber;
              }
            }
            hook = hook.next;
            guard++;
          }
        }
        fiber = fiber.return;
      }
    }
    return null;
  }

  function patchSheetsRunner() {
    if (window.__acmsSheetsPatched) return true;
    var rootEl = document.getElementById('root');
    if (!rootEl) return false;
    var fiber = findAiPanelFiber(rootEl);
    if (!fiber) return false;

    // React 19: useState setter 在 hook.queue.dispatch，memoizedState 是值本身
    // 找 bo ref（useRef(null)，current 是 _Rn stub 实例 = 空对象 + start/stop/send）
    // 找 Wr setter（useState(!1) = busy，唯一初始值 false 的 dispatch）
    // 找 Ri setter（useState([]) 第一个 [] = 消息列表）
    var hook = fiber.memoizedState;
    var boRef = null, busySetter = null, chatSetter = null;
    var seenEmptyArr = 0;
    while (hook) {
      var ms = hook.memoizedState;
      var q = hook.queue;
      // useState（React 19）
      if (q && typeof q.dispatch === 'function') {
        if (ms === false && !busySetter) { busySetter = q.dispatch; }
        if (Array.isArray(ms) && ms.length === 0) {
          seenEmptyArr++;
          if (seenEmptyArr === 1 && !chatSetter) chatSetter = q.dispatch;
        }
      }
      // useRef: 找 current 是 _Rn stub 实例的特征（空对象 + start/stop/send）
      if (ms && typeof ms === 'object' && 'current' in ms && !Array.isArray(ms)) {
        var c = ms.current;
        if (c && typeof c === 'object' && !Array.isArray(c) &&
            typeof c.start === 'function' && typeof c.stop === 'function' && typeof c.send === 'function') {
          boRef = ms;
          break;
        }
      }
      hook = hook.next;
    }

    if (!boRef || !boRef.current) {
      console.warn('[acms-host-sheets] 没找到 bo runner ref（panel 可能还没渲染）');
      return false;
    }
    var runner = boRef.current;
    if (runner.__acmsPatched) return true;  // 幂等

    runner._busy = false;
    Object.defineProperty(runner, 'busy', {
      get: function() { return runner._busy; },
      set: function(v) { runner._busy = v; },
      configurable: true
    });

    runner.run = async function(message, attachments) {
      runner._busy = true;
      if (busySetter) try { busySetter(true); } catch(_) {}
      console.info('[acms-host-sheets] ACMS AI 消息 → ACMS Buddy:', message);

      // 组装 docContext：sheets-ui 的 desktopApi.readWorkbookRange 在浏览器是 stub，
      // 不能用来读单元格内容。改用 __sheetsDebug.snapshot 拿真实单元格数据（含 rows），
      // docContext 带 rows 供 LLM 参考现有内容（否则"填充测试数据"类指令无内容可依 → LLM 拒答）。
      var workbookInfo = null;
      var sheetRows = [];
      try {
        var sess = window.__sheetsDebug && window.__sheetsDebug.listSessions();
        if (sess && sess.length) {
          var snap = window.__sheetsDebug.snapshot(sess[0], 5, 30, 12);
          if (snap && snap.sheets) sheetRows = snap.sheets;
        }
      } catch(e) {}
      try { workbookInfo = window.__sheetsAI && window.__sheetsAI.getWorkbookInfo(); } catch(e) {}
      var docContext = {
        sheets: (sheetRows.length ? sheetRows : (workbookInfo && workbookInfo.sheets || [])).map(function(s) {
          return { id: s.id, name: s.name, rows: s.rows || undefined };
        })
      };

      var summary = '', errMsg = null;
      var controller = null;
      try {
        // v0.97: LLM 处理要 20-40s（curl 实测 27s），fetch 无超时会无限"思考中"。
        // AbortController 90s 超时 → 明确报错回显而不是永远转圈。
        controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timeoutId = null;
        if (controller) {
          timeoutId = setTimeout(function () { try { controller.abort(); } catch (e) {} }, 90000);
        }
        var resp = await fetch('/api/agent-buddy/office-action?api_key=dev-key-001', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-API-Key': 'dev-key-001' },
          body: JSON.stringify({ kind: 'xlsx', instruction: message, docContext: docContext }),
          signal: controller ? controller.signal : undefined
        });
        if (timeoutId) clearTimeout(timeoutId);
        var data = await resp.json();
        if (data && data.ok && data.action) {
          summary = data.action.summary || 'AI 已应用编辑';
          // v0.97: 归一化 LLM 常犯的公式格式错误（zod 校验会因 value 是对象而失败）：
          // ① {"op":"set_cell","value":{"formula":"=C2*D2"}} → set_formula
          // ② {"op":"set_cell","formula":"=C2*D2"}（没 value）→ set_formula
          if (data.action.operations && Array.isArray(data.action.operations)) {
            // v0.97: sheetId 归一化——LLM 常自造 sheet1/sheet2（或漏连字符），
            // 真实 sheetId 以 snapshot 为准（sheet-1 等）。不匹配则替换成第一个真实 id。
            var realSheets = [];
            try {
              var ss2 = window.__sheetsDebug && window.__sheetsDebug.listSessions();
              if (ss2 && ss2.length) {
                var sn2 = window.__sheetsDebug.snapshot(ss2[0], 5, 30, 12);
                if (sn2 && sn2.sheets) realSheets = sn2.sheets.map(function(x){ return x.id; });
              }
              if (!realSheets.length) {
                var wbi = window.__sheetsAI && window.__sheetsAI.getWorkbookInfo();
                if (wbi && wbi.sheets) realSheets = wbi.sheets.map(function(x){ return x.id; });
              }
            } catch (e) {}
            var firstReal = realSheets.length ? realSheets[0] : null;
            data.action.operations = data.action.operations.map(function(op) {
              if (!op || !op.op) return op;
              if (firstReal && op.sheetId && realSheets.indexOf(op.sheetId) === -1) {
                console.warn('[acms-host-sheets] sheetId 归一化:', op.sheetId, '→', firstReal);
                op.sheetId = firstReal;
              }
              if (!op.sheetId && firstReal) op.sheetId = firstReal;
              if (op.op === 'set_cell') {
                var f = null;
                if (op.value && typeof op.value === 'object' && !Array.isArray(op.value) && typeof op.value.formula === 'string') f = op.value.formula;
                else if (typeof op.formula === 'string') f = op.formula;
                if (f) {
                  var clean = { op: 'set_formula', sheetId: op.sheetId, address: op.address, formula: f };
                  if (op.expectedFormula) clean.expectedFormula = op.expectedFormula;
                  return clean;
                }
                // 兜底：set_cell 的 value 是对象但不是公式（zod 只收 string/number/boolean/null）
                if (op.value && typeof op.value === 'object' && !Array.isArray(op.value)) {
                  try { op.value = JSON.stringify(op.value); } catch (e) { op.value = String(op.value); }
                }
              }
              return op;
            });
          }
          if (window.parent.OfficeV3 && typeof window.parent.OfficeV3.runAction === 'function') {
            var r = await window.parent.OfficeV3.runAction(data.action);
            if (r && r.ok) {
              summary = (data.action.summary || 'AI 已应用编辑') + '（已写入 Excel）';
              // v0.97.2: AI 写入成功 → 标记 dirty（提示用户保存）
              try { window.__markDirty && window.__markDirty(); } catch (e) {}
            } else {
              errMsg = (r && r.error) || 'Excel 应用失败';
            }
          } else {
            errMsg = 'parent.OfficeV3.runAction 不可用';
          }
        } else {
          errMsg = (data && data.error) || 'office-action 返回失败';
        }
      } catch (e) {
        if (e && e.name === 'AbortError') {
          errMsg = 'AI 处理超时（90 秒），请重试或简化指令';
        } else {
          errMsg = '请求失败: ' + (e && e.message ? e.message : String(e));
        }
        console.warn('[acms-host-sheets] office-action 异常:', e);
      }

      // ⚠️ v0.97: 不用 chatSetter 替换 streaming（OLn 有多个 useState([])，seenEmptyArr===1 找错 setter → 聊天区永远卡"思考中"）。
      // 返回 {summary, errMsg} 给 __acmsOfficeAction 覆盖层，由它用 api.appendChat 追加完成消息（adapter 内置版同款、已验证能显示）。
      runner._busy = false;
      if (busySetter) try { busySetter(false); } catch(_) {}
      return { summary: summary, errMsg: errMsg };
    };

    runner.cancel = function() {
      runner._busy = false;
      if (busySetter) try { busySetter(false); } catch(_) {}
    };
    runner.reset = function() { runner._busy = false; };

    // P144: GenOffice 面板发送优先走 window.__acmsOfficeAction（adapter 内置 ACMS 桥），
    // 它直接 listSessions() 拿快照——用户刚打开工作簿就用 AI 时 session 还没注册（workbook:select 异步）
    // → 空数组 → 抛「工作簿未加载」。覆盖它：复用已 patch 的 runner.run（走 ACMS Buddy office-action），
    // 且 session 未就绪时轮询等待，避免时序竞态。
    // ⚠️ v0.97: 必须像 adapter 内置版一样先 appendChat({role:'assistant', streaming:true})——
    // runner.run 的回显靠 chatSetter 找这条 streaming 消息替换成 ✅/❌，不加则面板永远无回复。
    window.__acmsOfficeAction = function (message, attachments, api) {
      if (window.__acmsOfficeActionRunning) return;  // 防重复入（双击发送/React 重渲染）
      window.__acmsOfficeActionRunning = true;
      try {
        if (api && api.setAiBusy) api.setAiBusy(true);
        if (api && api.appendChat) api.appendChat({ role: 'assistant', text: '', tools: [], streaming: true });
      } catch (e) {}
      var doRun = function () {
        return runner.run(message, attachments || []).then(function (res) {
          // v0.97: 用 api.appendChat 追加完成消息（adapter 内置版同款回显，不依赖 chatSetter）
          var text = (res && res.errMsg) ? ('❌ ' + res.errMsg) : ('✅ ' + ((res && res.summary) || 'AI 已应用编辑'));
          try {
            if (api && api.appendChat) api.appendChat({ role: 'assistant', text: text, tools: [], isError: !!(res && res.errMsg) });
            if (api && api.persistChatMessage) api.persistChatMessage('assistant', text);
          } catch (e2) {}
          window.__acmsOfficeActionRunning = false;
          if (api && api.setAiBusy) { try { api.setAiBusy(false); } catch (e) {} }
        }).catch(function (e3) {
          var text = '❌ ' + ((e3 && e3.message) ? e3.message : 'AI 调用异常');
          try {
            if (api && api.appendChat) api.appendChat({ role: 'assistant', text: text, tools: [], isError: true });
          } catch (e4) {}
          window.__acmsOfficeActionRunning = false;
          if (api && api.setAiBusy) { try { api.setAiBusy(false); } catch (e) {} }
        });
      };
      // 等待 session 就绪（最多 8s，200ms 间隔）
      var waited = 0;
      var tick = function () {
        try {
          var s = window.__sheetsDebug && window.__sheetsDebug.listSessions();
          if (s && s.length > 0) { doRun(); return; }
        } catch (e) {}
        waited += 200;
        if (waited < 8000) setTimeout(tick, 200);
        else doRun();  // 超时也跑，让 Buddy 侧报具体错误
      };
      tick();
    };

    window.__acmsSheetsPatched = true;
    console.info('[acms-host-sheets] ✅ ACMS AI runner patched → ACMS Buddy 接管');
    return true;
  }

  function setupAcmsAiPatchLoop() {
    if (window.__acmsSheetsPatchInterval) return;
    function tryInject() {
      if (window.parent && window.parent.ACMS && window.parent.ACMS.Buddy) {
        patchSheetsRunner();
        window.__acmsSheetsPatchInterval = setInterval(patchSheetsRunner, 1200);
        setTimeout(function() {
          if (window.__acmsSheetsPatchInterval) { clearInterval(window.__acmsSheetsPatchInterval); window.__acmsSheetsPatchInterval = null; }
        }, 30000);
        // MutationObserver：AI 面板渲染完立即 patch，避免 1.2s 轮询延迟
        if (!window.__acmsSheetsPanelObserver) {
          window.__acmsSheetsPanelObserver = new MutationObserver(function(muts) {
            for (var i = 0; i < muts.length; i++) {
              var added = muts[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var n = added[j];
                if (n && n.nodeType === 1 && n.querySelector && n.querySelector('.ai-panel-header')) {
                  patchSheetsRunner();
                  break;
                }
              }
            }
          });
          window.__acmsSheetsPanelObserver.observe(document.body, { childList: true, subtree: true });
        }
      } else {
        setTimeout(tryInject, 400);
      }
    }
    tryInject();
  }

  // 在 __init 完成后启动 patch 轮询
  var _origInit = window.__init;
  window.__init = async function (opts) {
    var result = await _origInit(opts);
    setTimeout(setupAcmsAiPatchLoop, 800);
    return result;
  };

  window.__ready = true
</script>
