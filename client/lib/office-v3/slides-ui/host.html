<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GenOffice Slides Host</title>
<link rel="stylesheet" href="/client/lib/office-v3/slides-ui/acms-office-slides-ui.css?v=9">
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;}#root{height:100vh;}</style>
</head>
<body>
<div id="root"></div>
<script>
  // iframe console 转发到主窗口（调试）
  ;['log', 'error', 'warn'].forEach(function (lv) {
    var orig = console[lv];
    console[lv] = function () {
      var parts = Array.prototype.map.call(arguments, function (x) {
        if (typeof x === 'string') return x;
        try { return JSON.stringify(x); } catch (e) { return String(x); }
      });
      try { parent.postMessage({ type: 'iframe-console', level: lv, msg: parts.join(' ').slice(0, 300) }, '*'); } catch (e) {}
      orig.apply(console, arguments);
    };
  });
  // process polyfill（slides-main-browser 依赖）
  if (!window.process) {
    window.process = {
      env: { NODE_ENV: 'production' },
      platform: 'win32',
      arch: 'x64',
      versions: {},
      nextTick: function (fn) { setTimeout(fn, 0); },
      cwd: function () { return '/'; },
    };
  }
  // Buffer polyfill（slides-main-browser 依赖 Node Buffer）
  if (!window.Buffer) {
    // jszip/引擎会调 Buffer.from(name).toString('utf8')——给 Uint8Array 补 utf8 toString
    // P138: 还要补 base64（media resolver 用 Buffer.from(bytes).toString('base64') 生成 dataUrl；
    // 缺 base64 分支 → 落回原生 toString → "137,80,78,71,..." 逗号分隔字节 → 图片 dataUrl 损坏 → 图标空白）
    if (typeof Uint8Array.prototype.toString === 'function') {
      var origU8ToString = Uint8Array.prototype.toString;
      Uint8Array.prototype.toString = function (enc) {
        if (enc === 'utf8' || enc === 'utf-8') {
          try { return new TextDecoder('utf-8').decode(this); } catch (e) { return origU8ToString.call(this); }
        }
        if (enc === 'base64') {
          // 分块 String.fromCharCode，避免大图 (>=0x8000 字节) 栈溢出
          var CHUNK = 0x8000, s = '';
          for (var i = 0; i < this.length; i += CHUNK) {
            s += String.fromCharCode.apply(null, this.subarray(i, i + CHUNK));
          }
          return btoa(s);
        }
        return origU8ToString.call(this);
      };
    }
    window.Buffer = {
      from: function (data, enc) {
        if (typeof data === 'string') {
          var s = enc === 'base64' ? atob(data) : data;
          var u8 = new Uint8Array(s.length);
          for (var i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
          return u8;
        }
        if (data instanceof Uint8Array) return data;
        if (Array.isArray(data)) return new Uint8Array(data);
        return new Uint8Array(data || 0);
      },
      alloc: function (n) { return new Uint8Array(n); },
      isBuffer: function () { return false; },
      concat: function (arr) {
        var total = 0, i;
        for (i = 0; i < arr.length; i++) total += arr[i].length;
        var out = new Uint8Array(total), off = 0;
        for (i = 0; i < arr.length; i++) { out.set(arr[i], off); off += arr[i].length; }
        return out;
      },
    };
  }
</script>
<script type="module">
  // iframe host：由父窗口（ACMS office-v3-bridge）调用 __init/__unmount
  let mod = null
  let rootEl = null

  // 状态写到 rootEl 的 data-* 属性，父窗口直接读 DOM 跨 navigation 持久
  function report(stage, msg) {
    try {
      if (!rootEl) rootEl = document.getElementById('root')
      if (rootEl) {
        rootEl.setAttribute('data-host-stage', String(stage))
        rootEl.setAttribute('data-host-msg', String(msg || '').slice(0, 250))
        rootEl.setAttribute('data-host-time', new Date().toISOString())
      }
      parent.postMessage({ type: 'slides-host', stage: stage, msg: msg }, '*')
    } catch (e) {}
  }

  window.__init = async function (opts) {
    opts = opts || {}
    try {
      report('init_start', 'fileId=' + (opts.fileId || 'null') + ' fileName=' + (opts.fileName || 'null'))
      if (!mod) mod = await import('/client/lib/office-v3/slides-ui/office-slides-ui.js?v=15')
      report('mod_loaded', 'mod has mountSlidesUI=' + (typeof mod.mountSlidesUI))
      if (rootEl && mod.unmountSlidesUI) {
        try { mod.unmountSlidesUI(rootEl) } catch (e) { report('unmount_err', e.message) }
      }
      rootEl = document.getElementById('root')
      rootEl.innerHTML = ''
      let bin = null
      if (opts.fileId) {
        const dlName = encodeURIComponent(opts.fileName || 'document.pptx')
        const url = '/api/office/download/' + encodeURIComponent(opts.fileId) + '/' + dlName + '?api_key=' + (opts.apiKey || 'dev-key-001')
        report('fetch_start', url)
        const resp = await fetch(url)
        report('fetch_resp', 'ok=' + resp.ok + ' status=' + resp.status + ' ct=' + (resp.headers.get('content-type') || 'null'))
        if (!resp.ok) throw new Error('下载 HTTP ' + resp.status)
        bin = new Uint8Array(await resp.arrayBuffer())
        report('fetch_ok', bin.length + 'B magic=' + String.fromCharCode(bin[0], bin[1], bin[2], bin[3]))
      }
      // 关键：mountSlidesUI 内部 installSlidesApiBridge + setPendingBytes(bin) + createRoot.render(<App/>)
      // React App 启动后 useEffect 跑 consumePendingOpen 读 pendingBytes（已被 set）
      mod.mountSlidesUI(rootEl, {
        fileId: opts.fileId || undefined,
        fileName: opts.fileName || 'untitled.pptx',
        apiKey: opts.apiKey || 'dev-key-001',
        buffer: bin || undefined,
      })
      report('mount_done', 'pendingBytes=' + (bin ? bin.length + 'B' : 'null') + ' hasEditor=' + !!window.__slidesEditor)
      // 兜底：React App 启动是 async，多次 setPendingBytes 防止 race
      if (bin && window.__slidesEditor) {
        let n = 0
        const iv = setInterval(function () {
          try {
            window.__slidesEditor.setPendingBytes(bin)
            n++
            if (n >= 10) { clearInterval(iv); report('retry_done', 'setPendingBytes x10') }
          } catch (e) { clearInterval(iv); report('retry_err', e.message) }
        }, 100)
      }
      // 浏览器 shim：拦截 'openPptx'/'open'/'slides:open'，走原生 <input type="file"> 选文件后
      // 喂给 setPendingBytes + consume-pending-open（Electron stub dialog.showOpenDialog 永远返回 canceled）
      patchBrowserFileOpen()
      return { ok: true }
    } catch (e) {
      console.error('[genoffice-slides-host] __init 失败:', e)
      report('failed', e.message)
      return { ok: false, error: e.message }
    }
  }

  window.__unmount = function () {
    try {
      if (rootEl && mod && mod.unmountSlidesUI) mod.unmountSlidesUI(rootEl)
    } catch (e) {}
    rootEl = null
  }

  // ── 浏览器文件打开 shim（拦截 'openPptx' / 'open' / 'slides:open'） ──
  // GenOffice Slides 主进程 stub 的 dialog.showOpenDialog 永远返回 canceled，
  // 导致 Ribbon「打开…」按钮点了不弹窗。这里 wrap __slidesEditor.call 走浏览器原生
  // <input type="file">，读字节后喂给 setPendingBytes + consume-pending-open（已在浏览器跑通）
  function patchBrowserFileOpen() {
    if (!window.__slidesEditor || window.__slidesEditor.__browserOpenPatched) return
    const ed = window.__slidesEditor
    const PPTX_ACCEPT = '.pptx,.ppt,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint'
    const IMAGE_ACCEPT = 'image/*'
    const MODEL3D_ACCEPT = '.glb,.gltf,.obj'

    function pickFile(accept) {
      return new Promise(function (resolve) {
        try {
          const inp = document.createElement('input')
          inp.type = 'file'
          if (accept) inp.accept = accept
          inp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;'
          document.body.appendChild(inp)
          let settled = false
          function done(file) {
            if (settled) return
            settled = true
            try { inp.remove() } catch (e) {}
            resolve(file || null)
          }
          inp.addEventListener('change', function () {
            const f = inp.files && inp.files[0]
            done(f)
          })
          // 用户取消（modern browser 关闭 dialog 不触发 change，靠 focus/timeout 兜底）
          setTimeout(function () { done(null) }, 10 * 60 * 1000)
          inp.click()
        } catch (e) {
          console.warn('[slides-host] pickFile failed:', e)
          resolve(null)
        }
      })
    }

    // fitWidthPx 探测：bridge 暴露的 __slidesEditor 没存这个，renderer's useCallback 里硬编码 1280
    // （app-constants.ts FIT_WIDTH），保守取 1280 与 PPT 编辑层一致
    const DEFAULT_FIT_WIDTH = 1280

    const originalCall = ed.call.bind(ed)
    ed.call = async function (channel, ...rest) {
      // API 名称映射：CamelCase → snake_case（GenOffice API 桥接）
      const ch = channel === 'addSmartArt' ? 'slides:add-smartart' :
                 channel === 'insertModel3d' ? 'slides:insert-model3d' :
                 channel === 'addChart' ? 'slides:add-chart' :
                 channel === 'addElement' ? 'slides:add-element' :
                 channel === 'addTable' ? 'slides:add-table' :
                 channel
      // 文件打开：PPTX
      if (ch === 'openPptx' || ch === 'open' || ch === 'slides:open' || ch === 'slides:open-pptx') {
        try {
          const fitWidthPx = (rest && rest[0]) || DEFAULT_FIT_WIDTH
          const file = await pickFile(PPTX_ACCEPT)
          if (!file) { report('user_cancel', 'no file picked'); return null }
          const bytes = new Uint8Array(await file.arrayBuffer())
          report('browser_picked', file.name + ' ' + bytes.length + 'B')
          ed.setPendingBytes(bytes)
          // 走已有链路 consume-pending-open → openBytes → openPptx → 返回 {path, slides, size, defaultFont}
          return await originalCall('slides:consume-pending-open', fitWidthPx)
        } catch (e) {
          report('browser_open_err', e.message || String(e))
          console.error('[slides-host] browser file open failed:', e)
          return null
        }
      }
      // 打开路径（双击文件关联等）：浏览器无路径概念，转走文件选择
      if (ch === 'openPath' || ch === 'slides:open-path') {
        try {
          const fitWidthPx = (rest && rest[1]) || DEFAULT_FIT_WIDTH
          const file = await pickFile(PPTX_ACCEPT)
          if (!file) { report('user_cancel', 'no file picked (open-path)'); return null }
          const bytes = new Uint8Array(await file.arrayBuffer())
          report('browser_picked', file.name + ' ' + bytes.length + 'B (open-path)')
          ed.setPendingBytes(bytes)
          return await originalCall('slides:consume-pending-open', fitWidthPx)
        } catch (e) {
          report('browser_open_err', e.message || String(e))
          return null
        }
      }
      // 图片插入（图标/图片填充）：用图片 accept
      if (ch === 'pickImage' || ch === 'insertImage' || ch === 'slides:pick-image' || ch === 'slides:insert-image') {
        try {
          const file = await pickFile(IMAGE_ACCEPT)
          if (!file) { report('user_cancel', 'no image picked'); return null }
          const bytes = new Uint8Array(await file.arrayBuffer())
          const ext = (file.name.split('.').pop() || 'png').toLowerCase()
          report('browser_image_picked', file.name + ' ' + bytes.length + 'B ext=' + ext)
          // 图片插入语义跟 PPT 文件打开不一样，不能污染 pendingBytes（pendingBytes 是 PPT 打开通道）。
          // 返回 null 让 renderer 走它自己的 fallback（如粘贴板图片 / 本地缓存），
          // 完整图片插入支持需要单独的 IPC 通道 + 后端接收，暂不在本修复范围。
          return null
        } catch (e) {
          report('browser_image_err', e.message || String(e))
          return null
        }
      }
      // 3D 模型插入：GLB/GLTF/OBJ 文件选择 → 写 fake dialog + fake fs → 走 originalCall
      // Vb() stub 已 patch 支持 globalThis._slidesFakeDialog
      // pp() stub 已 patch 支持 globalThis._slidesFakeFiles
      if (ch === 'slides:insert-model3d') {
        try {
          const file = await pickFile(MODEL3D_ACCEPT)
          if (!file) { report('user_cancel', 'no 3D model picked'); return null }
          const bytes = new Uint8Array(await file.arrayBuffer())
          const ext = (file.name.split('.').pop() || 'glb').toLowerCase()
          const fakePath = '/tmp/fake-3d-model.' + ext
          if (!globalThis._slidesFakeDialog) globalThis._slidesFakeDialog = {}
          globalThis._slidesFakeDialog.path = fakePath
          if (!globalThis._slidesFakeFiles) globalThis._slidesFakeFiles = {}
          globalThis._slidesFakeFiles[fakePath] = bytes
          report('browser_model3d_picked', file.name + ' ' + bytes.length + 'B ext=' + ext)
          const result = await originalCall(ch, rest[0], rest[1])
          // 清理 fake state
          delete globalThis._slidesFakeDialog
          delete globalThis._slidesFakeFiles[fakePath]
          return result
        } catch (e) {
          report('browser_model3d_err', e.message || String(e))
          console.error('[slides-host] 3D model insert failed:', e)
          return null
        }
      }
      // save-as / pick-export-dir / pick-export-pdf-path：浏览器无写文件 API，暂不支持
      if (ch === 'slides:save-as' || ch === 'slides:pick-export-dir' || ch === 'slides:pick-export-pdf-path') {
        report('not_supported', ch + ' not supported in browser')
        return ch === 'slides:save-as' ? { ok: false, error: 'browser_no_saveas' } : null
      }
      // edit-image-fill：图片替换，暂不支持
      if (ch === 'slides:edit-image-fill') {
        return null
      }
      return originalCall(ch, ...rest)
    }
    ed.__browserOpenPatched = true
    report('patched', 'browser file open shim installed')
  }

  window.__ready = true
</script>
</body>
</html>
