  // 生成单张设定图（不走 LLM，直接用确认卡里的 imagePrompt）
  function generateOneBibleImage(item, styleObj) {
    var prompt = (styleObj && styleObj.prefix ? styleObj.prefix : '') + String(item.imagePrompt || item.description || item.name);
    return fetch('/api/image-tools/ai-generate?api_key=dev-key-001', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': 'dev-key-001' },
      body: JSON.stringify({ prompt: prompt, n: 1, size: '1024x1024' })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data || !data.ok || !data.options || !data.options.length) {
        throw new Error((data && data.error) || '生图失败');
      }
      var opt = data.options[0];
      var img = opt.dataUrl || opt.image_url_output;
      if (!img) throw new Error('生图返回缺少图片数据');
      // 非 data URI → 前端 fetch 转 base64
      if (img.indexOf('data:') !== 0) {
        return fetch(img).then(function (r2) { return r2.blob(); }).then(function (blob) {
          return new Promise(function (resolve) {
            var fr = new FileReader();
            fr.onload = function () { resolve(fr.result); };
            fr.readAsDataURL(blob);
          });
        });
      }
      return img;
    });
  }

  // 重新生成一张（🎲 换一张）：生成 → 更新档案库
  function regenerateOne(result, cb) {
    var lib = result.kind === 'scene' ? acmsLib('acmsSceneLib') : acmsLib('acmsCharacterLib');
    generateOneBibleImage(result, result.styleObj).then(function (dataUrl) {
      if (result.libraryId && lib && lib.update) {
        return lib.update(result.libraryId, { referenceImage: dataUrl }).then(function () {
          result.image = dataUrl; result.ok = true; result.error = null;
          cb(true);
        });
      }
      // 没有 libraryId（首次失败）→ 重新创建
      if (lib && lib.create) {
        return lib.create({
          name: result.name,
          aliases: result.aliases || [],
          description: result.description || '',
          referenceImage: dataUrl,
          sourceDocId: acmsDocId,
          sourceDocName: acmsDocName
        }).then(function (resp) {
          if (resp && resp.ok && resp.data) { result.libraryId = resp.data.id; }
          result.image = dataUrl; result.ok = true; result.error = null;
          cb(true);
        });
      }
      throw new Error('档案库 API 不可用');
    }).catch(function (e) { cb(false, e.message); });
  }

  // ── 主编排：全文 → 分析 → 确认 → 生成 → 入库 ──
  async function runFullBibleFlow() {
    var fullText = buildAcmsFullText();
    if (!fullText || fullText.length < 100) {
      showAcmsToast('⚠️ 文档内容太少（需 ≥100 字），先写点内容再建设定集', 'warn', 3500);
      return;
    }
    if (!acmsLib('acmsVisualBible') || !acmsLib('acmsVisualBible').analyzeDocument) {
      showAcmsToast('❌ 设定集 API 未加载（visual-bible.js 缺失？）', 'error');
      return;
    }
    var progress = showBibleProgressPanel({ title: '🎬 分析全文…' });
    progress.setMessage('正在分析 ' + fullText.length + ' 字…');
    var bible;
    try {
      bible = await acmsLib('acmsVisualBible').analyzeDocument(fullText, {
        onProgress: function (p) { progress.update(p); }
      });
    } catch (e) {
      progress.close();
      showAcmsToast('❌ 分析失败: ' + e.message, 'error', 4000);
      return;
    }
    progress.close();

    if (!bible.characters.length && !bible.scenes.length) {
      showAcmsToast('⚠️ 没抽取到有视觉意义的人物或场景', 'warn', 4000);
      return;
    }

    showVisualBibleConfirmPanel(bible, {
      onConfirm: function (confirmed, styleObj) {
        var items = [];
        confirmed.characters.forEach(function (c) { items.push(Object.assign({ kind: 'character' }, c)); });
        confirmed.scenes.forEach(function (s) { items.push(Object.assign({ kind: 'scene' }, s)); });
        if (!items.length) { showAcmsToast('⚠️ 没有勾选任何条目', 'warn'); return; }
        generateBibleImagesSerial(items, styleObj);
      }
    });
  }

  // 串行生成 + 入库 + 结果卡
  async function generateBibleImagesSerial(items, styleObj) {
    var progress = showBibleProgressPanel({
      title: '🎬 生成设定图（' + items.length + ' 张）',
      cancel: true,
      onCancel: function () { /* 关窗即停（已在飞的请求不撤回） */ }
    });
    var results = [];
    for (var i = 0; i < items.length; i++) {
      if (progress.isClosed()) break;
      var it = items[i];
      progress.update({ current: i, total: items.length, message: '正在生成「' + it.name + '」（' + (i + 1) + '/' + items.length + '）…' });
      progress.setPercent(Math.round(i / items.length * 100));
      var r = { name: it.name, kind: it.kind, ok: false, image: null, error: null, prompt: it.imagePrompt, description: it.description, aliases: it.aliases, styleObj: styleObj, libraryId: null };
      try {
        var dataUrl = await generateOneBibleImage(it, styleObj);
        // 落库
        var lib = it.kind === 'scene' ? acmsLib('acmsSceneLib') : acmsLib('acmsCharacterLib');
        if (lib && lib.create) {
          var resp = await lib.create({
            name: it.name,
            aliases: it.aliases || [],
            description: it.description || '',
            referenceImage: dataUrl,
            sourceDocId: acmsDocId,
            sourceDocName: acmsDocName
          });
          if (resp && resp.ok && resp.data) r.libraryId = resp.data.id;
          else r.error = (resp && resp.error) || '入库失败';
        } else {
          r.error = '档案库 API 不可用';
        }
        r.image = dataUrl;
        r.ok = !r.error;
      } catch (e) {
        r.error = e.message;
        console.warn('[visual-bible] 生成失败:', it.name, e.message);
      }
      results.push(r);
    }
    progress.update({ current: items.length, total: items.length, message: '完成' });
    progress.close();

    var okCount = results.filter(function (x) { return x.ok; }).length;
    showAcmsToast('✅ 设定集已建立：' + okCount + '/' + results.length + ' 张入库', okCount === results.length ? 'ok' : 'warn', 3000);
    showBibleResultPanel(results, {
      onClose: function () {
        // 刷新浮窗里的角色/场景列表（如果还开着）
      }
    });
  }

  function showAcmsToast(msg, kind) {
    var el = document.getElementById('acms-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'acms-toast';
      el.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:999999;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.25);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:70%;transition:opacity .25s;';
      document.body.appendChild(el);
    }
    var bg = kind === 'ok' ? '#2e7d32' : kind === 'error' ? '#c62828' : kind === 'warn' ? '#ef6c00' : '#1565c0';
    el.style.background = bg;
    el.style.color = '#fff';
    el.textContent = msg;
    el.style.opacity = '1';
    el.style.display = 'block';
    clearTimeout(el.__t);
    var duration = arguments[2] || 2600;
    el.__t = setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.style.display = 'none'; }, 300); }, duration);
  }

  // v0.96.9b: 往 GenOffice 原生右键菜单（.ctx-menu）注入 AI 动作项
  // 不拦截原生右键——剪切/复制/粘贴/字体等菜单项照常可用，AI 动作追加在菜单末尾
  function bindAcmsContextMenu() {
    if (window.__acmsCtxMenuBound) return;
    window.__acmsCtxMenuBound = true;

    function injectAiMenuItems() {
      try {
        var menu = document.querySelector('.ctx-menu');
        if (!menu) return;
        // 幂等：已注入则跳过（React 重渲染冲掉后，下次右键会重新注入）
        if (menu.querySelector('[data-acms-ai]')) return;
        // 添加 AI 二级菜单项
        var sep = document.createElement('div');
        sep.className = 'ctx-sep';
        sep.setAttribute('data-acms-ai', 'sep');
        menu.appendChild(sep);
        // 创建"AI 助手"子菜单
        var aiMenuItem = document.createElement('button');
        aiMenuItem.className = 'ctx-item';
        aiMenuItem.setAttribute('data-acms-ai', 'ai-submenu');
        var aiLbl = document.createElement('span');
        aiLbl.className = 'ctx-label';
        aiLbl.textContent = '🤖 AI 助手';
        var aiKey = document.createElement('span');
        aiKey.className = 'ctx-key';
        aiKey.textContent = '▸';
        aiMenuItem.appendChild(aiLbl);
        aiMenuItem.appendChild(aiKey);
        menu.appendChild(aiMenuItem);
        // 创建子菜单容器
        var subMenu = document.createElement('div');
        subMenu.className = 'ctx-submenu';
        subMenu.setAttribute('data-acms-ai', 'submenu');
        subMenu.style.display = 'none';
        subMenu.style.position = 'absolute';
        subMenu.style.left = '100%';
        subMenu.style.top = '0';
        subMenu.style.background = getComputedStyle(document.body).backgroundColor || '#fff';
        subMenu.style.border = '1px solid #ddd';
        subMenu.style.padding = '4px 0';
        subMenu.style.zIndex = '10000';
        document.body.appendChild(subMenu);
        // 子项：润色/排版/总结走原 acmsRunSelectionAction；生成插图弹浮窗（不走 LLM，直接调 bridge 生图）
        var subItems = [
          { key: 'polish', label: '✨ 润色', run: function () { acmsRunSelectionAction('polish'); } },
          { key: 'format', label: '📐 排版', run: function () { acmsRunSelectionAction('format'); } },
          { key: 'summarize', label: '📝 总结', run: function () { acmsRunSelectionAction('summarize'); } },
          {
            key: 'image', label: '🎨 生成插图', run: function () {
              var ctx = buildAcmsDocContext();
              if (!ctx || !ctx.selBlockIdx || !ctx.selBlockIdx.length) {
                showAcmsToast('⚠️ 请先在文档中选中文字', 'warn');
                return;
              }
              var anchor = window.__acmsCtxMenuPos || { x: 100, y: 100 };
              // P198 增强：弹 mini 浮窗让用户选风格 + 改画面描述
              showImageStylePanel({
                selText: ctx.doc.selectionText || '',
                anchorX: anchor.x,
                anchorY: anchor.y,
                onSubmit: function (finalPrompt, style, referenceImages, charNames, sceneName) {
                  // P198: 绕过 LLM，直接构造 generateImage action 走 bridge 生图（含 referenceImage 链式风格一致性）
                  // P199: 角色档案库 + 场景档案库多图合成 — referenceImages 含多张角色/场景参考图（dataUrl 数组）
                  var action = {
                    op: 'generateImage',
                    kind: 'word',
                    prompt: finalPrompt,
                    summary: '已生成 ' + style.label + ' 风格插图' +
                      ((charNames && charNames.length) ? '（含 ' + charNames.join('、') + '）' : '') +
                      (sceneName ? ' @ ' + sceneName : '')
                  };
                  if (referenceImages && referenceImages.length > 0) {
                    action.referenceImages = referenceImages;
                  }
                  if (window.parent.OfficeV3 && typeof window.parent.OfficeV3.runAction === 'function') {
                    showAcmsToast('⏳ 正在生成 ' + style.label + ' 插图...', 'info', 3000);
                    window.parent.OfficeV3.runAction(action).then(function (r) {
                      if (r && r.ok) {
                        showAcmsToast('✅ ' + (action.summary || '插图已生成'), 'ok');
                      } else {
                        showAcmsToast('❌ ' + ((r && r.error) || '生成失败'), 'error');
                      }
                    }).catch(function (e) {
                      showAcmsToast('❌ ' + e.message, 'error');
                    });
                  } else {
                    showAcmsToast('❌ parent.OfficeV3.runAction 不可用', 'error');
                  }
                }
              });
            }
          },
          {
            // P200: 全文视觉设定集 — AI 从全文抽取人物/场景 → 生成设定图 → 建立一致性基准
            key: 'bible', label: '🎬 生成全文设定集', run: function () {
              var fullText = buildAcmsFullText();
              if (!fullText || fullText.length < 100) {
                showAcmsToast('⚠️ 文档内容太少（需 ≥100 字）', 'warn');
                return;
              }
              runFullBibleFlow();
            }
          }
        ];
        subItems.forEach(function (it) {
          var btn = document.createElement('button');
          btn.className = 'ctx-item';
          btn.setAttribute('data-acms-ai', it.key);
          var lbl = document.createElement('span');
          lbl.className = 'ctx-label';
          lbl.textContent = it.label;
          btn.appendChild(lbl);
          btn.onclick = function (e) {
            e.preventDefault();
            e.stopPropagation();
            subMenu.style.display = 'none';
            it.run();
          };
          subMenu.appendChild(btn);
        });
        // 鼠标悬停显示子菜单（带延迟避免抖动）— P198 增强：位置边界检测
        var subMenuTimer = null;
        function positionSubMenu() {
          var rect = aiMenuItem.getBoundingClientRect();
          var subRect = subMenu.getBoundingClientRect();
          var vw = window.innerWidth, vh = window.innerHeight;
          // 默认贴右侧
          var left = rect.right;
          var top = rect.top;
          // 右侧溢出 → 贴左侧
          if (left + subRect.width > vw - 8) left = Math.max(8, rect.left - subRect.width);
          // 下方溢出 → 上对齐菜单底部
          if (top + subRect.height > vh - 8) top = Math.max(8, vh - subRect.height - 8);
          subMenu.style.left = left + 'px';
          subMenu.style.top = top + 'px';
        }
        aiMenuItem.onmouseenter = function () {
          clearTimeout(subMenuTimer);
          subMenu.style.display = 'block';
          // 先放到位再读 rect（display:block 后才能拿到正确尺寸）
          positionSubMenu();
        };
        aiMenuItem.onmouseleave = function (e) {
          // 如果鼠标移到了子菜单上，不隐藏
          if (subMenu.contains(e.relatedTarget)) return;
          subMenuTimer = setTimeout(function () {
            subMenu.style.display = 'none';
          }, 150);
        };
        subMenu.onmouseenter = function () {
          clearTimeout(subMenuTimer);
        };
        subMenu.onmouseleave = function (e) {
          // 如果鼠标移回主菜单项，不隐藏
          if (aiMenuItem.contains(e.relatedTarget)) return;
          subMenuTimer = setTimeout(function () {
            subMenu.style.display = 'none';
          }, 150);
        };
        // 点击关闭子菜单
        aiMenuItem.onclick = function (e) {
          e.preventDefault();
          if (subMenu.style.display === 'block') {
            subMenu.style.display = 'none';
          }
        };
        console.info('[acms-host] ✅ AI 动作已注入原生右键菜单');
      } catch (e) {
        console.warn('[acms-host] 注入右键菜单失败:', e.message);
      }
    }

    // 每次右键后注入（菜单渲染完成时 .ctx-menu 已就位）
    // P198 增强：记录右键点击位置，作为子菜单/浮窗定位锚点
    document.addEventListener('contextmenu', function (e) {
      window.__acmsCtxMenuPos = { x: e.clientX, y: e.clientY };
      setTimeout(injectAiMenuItems, 200);
    }, true);
    // MutationObserver 兜底：React 重渲染冲掉注入项后自动补回
    var obs = new MutationObserver(function () {
      try {
        var menu = document.querySelector('.ctx-menu');
        if (menu && menu.querySelectorAll('.ctx-item').length && !menu.querySelector('[data-acms-ai]')) {
          injectAiMenuItems();
        }
      } catch (e) { /* ignore */ }
    });
    obs.observe(document.body, { childList: true, subtree: true });
    window.__acmsCtxMenuObserver = obs;
    console.info('[acms-host] ✅ 原生右键菜单 AI 项注入器已挂载（润色/排版/总结/生成插图）');
  }

  function setupAcmsAiButton() {
    try {
      // 1. patch runner（让侧边 AI 面板走 ACMS Buddy）
      patchACMSAiRunner();
      // 2.5 v0.96.9b: 挂原生右键菜单 AI 项注入器（不拦截原生菜单，追加 AI 动作）
      bindAcmsContextMenu();
      // P199: 绑定 AI 生成图片右键「存为角色/场景参考」菜单
      bindAiImageContextMenu();
    } catch(err) {
      console.warn('[acms-host] setupAcmsAiButton err:', err);
    }
  }
  function startAcmsAiPatchLoop() {
    if (acmsAiPatchInterval) return;
    // 等 ACMS Buddy ready 再注入按钮（避免点的时候 parent.ACMS.Buddy 还没加载）
    function tryInject() {
      if (window.parent && window.parent.ACMS && window.parent.ACMS.Buddy) {
        setupAcmsAiButton();
        acmsAiPatchInterval = setInterval(setupAcmsAiButton, 1200);
        setTimeout(function() {
          if (acmsAiPatchInterval) { clearInterval(acmsAiPatchInterval); acmsAiPatchInterval = null; }
        }, 30000);
        // MutationObserver: AI 面板出现时立即 patch（避免 1.2s 轮询延迟导致首次点击 ut.run 未 patch）
        if (!window.__acmsAiPanelObserver) {
          window.__acmsAiPanelObserver = new MutationObserver(function(muts) {
            for (var i = 0; i < muts.length; i++) {
                  var added = muts[i].addedNodes;
                  for (var j = 0; j < added.length; j++) {
                    var n = added[j];
                    if (n && n.querySelectorAll && n.querySelector('.ai-panel-header')) {
                      // AI 面板刚出现 — 立即 patch
                      patchACMSAiRunner();
                      break;
                    }
                  }
                }
          });
          window.__acmsAiPanelObserver.observe(document.body, { childList: true, subtree: true });
        }
      } else {
        setTimeout(tryInject, 400);
      }
    }
    tryInject();
  }
  function stopAcmsAiPatchLoop() {
    if (acmsAiPatchInterval) { clearInterval(acmsAiPatchInterval); acmsAiPatchInterval = null; }
    if (window.__acmsAiPanelObserver) { window.__acmsAiPanelObserver.disconnect(); window.__acmsAiPanelObserver = null; }
    if (window.__acmsCtxMenuObserver) { window.__acmsCtxMenuObserver.disconnect(); window.__acmsCtxMenuObserver = null; }
    if (window.__acmsAiImageObserver) { window.__acmsAiImageObserver.disconnect(); window.__acmsAiImageObserver = null; }
    var old = document.getElementById('acms-ai-btn');
    if (old) old.remove();
  }

  // P199: AI 生成图片右键「📌 存为角色/场景参考」快捷操作
  //   检测 docProtected imageBlock（带 genImage.dataUrl 的真图，不是 loading 占位）
  //   绑 contextmenu → 弹 mini 菜单 → 调 showCharacterQuickCreatePanel(kind + 预填图)
  function bindAiImageContextMenu() {
    if (window.__acmsAiImageBound) return;
    window.__acmsAiImageBound = true;

    function bindNode(node) {
      if (!node || node.nodeType !== 1) return;
      // 跳过已经绑过的
      if (node.__acmsAiImageBound) return;
      // 必须是 docProtected 容器 + blockType=image + 有 genImage.dataUrl
      var isImageBlock = node.classList && node.classList.contains('doc-protected') &&
                         node.getAttribute && node.getAttribute('data-block-type') === 'image';
      if (!isImageBlock) {
        // 也可能在子元素里（ProseMirror 节点结构）
        var inner = node.querySelector && node.querySelector('.doc-protected[data-block-type="image"]');
        if (inner && inner.__acmsAiImageBound) return;
        node = inner || node;
      }
      if (!node || !node.getAttribute) return;
      if (node.getAttribute('data-block-type') !== 'image') return;
      // 必须有 dataUrl（真图，不是 loading 占位）
      var dataUrl = node.getAttribute('data-image-dataurl') || node.getAttribute('data-genimage-dataurl');
      if (!dataUrl) {
        // 试从 inner 找
        var img = node.querySelector && node.querySelector('img');
        if (img) dataUrl = img.src || img.getAttribute('src');
      }
      if (!dataUrl || dataUrl.indexOf('data:image/') !== 0) return;
      node.__acmsAiImageBound = true;
      node.__acmsImageDataUrl = dataUrl;

      node.addEventListener('contextmenu', function (e) {
        // 如果右键命中原生菜单（GenOffice ctx-menu），放行
        if (e.target.closest && e.target.closest('.ctx-menu')) return;
        e.preventDefault();
        e.stopPropagation();
        showAiImageContextMenu(e.clientX, e.clientY, dataUrl);
      }, true);
    }

    function bindAll() {
      var imgs = document.querySelectorAll('.doc-protected[data-block-type="image"]');
      for (var i = 0; i < imgs.length; i++) bindNode(imgs[i]);
    }

    // MutationObserver：监听新插入的 imageBlock
    window.__acmsAiImageObserver = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var m = muts[i];
        for (var j = 0; j < m.addedNodes.length; j++) {
          bindNode(m.addedNodes[j]);
        }
      }
      // 兜底再扫一次（处理属性变化 — 比如 loading 状态切换到真图）
      bindAll();
    });
    window.__acmsAiImageObserver.observe(document.body, { childList: true, subtree: true });
    bindAll();
  }

  // AI 图片右键弹出的 mini 菜单 — 类似 ctx-menu 风格，但只含 2 个入库操作
  function showAiImageContextMenu(x, y, dataUrl) {
    var old = document.getElementById('acms-ai-image-menu');
    if (old) old.remove();
    var menu = document.createElement('div');
    menu.id = 'acms-ai-image-menu';
    menu.setAttribute('data-acms-ai-menu', 'true');
    menu.style.cssText = 'position:fixed;z-index:10000;background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px 0;box-shadow:0 4px 16px rgba(0,0,0,.15);font-family:inherit;min-width:200px;';
    menu.innerHTML =
      '<button class="acms-aimenu-item" data-act="save-char" type="button" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;border:none;background:transparent;text-align:left;font-size:13px;cursor:pointer;color:#333;font-family:inherit;">' +
        '<span style="font-size:16px;">📌</span>' +
        '<span>存为角色参考</span>' +
      '</button>' +
      '<button class="acms-aimenu-item" data-act="save-scene" type="button" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;border:none;background:transparent;text-align:left;font-size:13px;cursor:pointer;color:#333;font-family:inherit;">' +
        '<span style="font-size:16px;">🏞️</span>' +
        '<span>存为场景参考</span>' +
      '</button>';
    document.body.appendChild(menu);
    // 边界检测
    var rect = menu.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = x, top = y;
    if (left + rect.width > vw - 8) left = Math.max(8, vw - rect.width - 8);
    if (top + rect.height > vh - 8) top = Math.max(8, vh - rect.height - 8);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    function close() {
      menu.remove();
      document.removeEventListener('mousedown', outsideHandler);
      document.removeEventListener('keydown', escHandler);
    }
    function outsideHandler(e) {
      if (!menu.contains(e.target)) close();
    }
    function escHandler(e) { if (e.key === 'Escape') close(); }
    setTimeout(function () {
      document.addEventListener('mousedown', outsideHandler);
      document.addEventListener('keydown', escHandler);
    }, 50);

    menu.querySelectorAll('.acms-aimenu-item').forEach(function (btn) {
      btn.onmouseenter = function () { btn.style.background = '#e3f2fd'; };
      btn.onmouseleave = function () { btn.style.background = 'transparent'; };
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute('data-act');
        close();
        var kind = act === 'save-char' ? 'character' : 'scene';
        showCharacterQuickCreatePanel({
          anchorPanel: { getBoundingClientRect: function () { return { right: left + rect.width / 2, left: left + rect.width / 2, top: top, width: 0, height: 0 }; } },
          kind: kind,
          prefillImage: dataUrl,
          onCreated: function (item) {
            showAcmsToast('✅ ' + (kind === 'scene' ? '场景' : '角色') + '已入库: ' + item.name, 'ok', 2000);
          }
        });
        // quick-create 弹窗打开后，自动填名称 placeholder → 用户输入名即可
      };
    });
  }

  window.__init = async function (opts) {
    opts = opts || {}
    try {
      // P200: 记下当前文档标识（角色/场景库按文档隔离）
      acmsDocId = opts.fileId || ''
      acmsDocName = opts.fileName || ''
      if (!mod) mod = await import('/client/lib/office-v3/word-ui/office-word-ui.js?v=0.96.9c')
      // 卸载旧实例
      if (rootEl && mod.unmountWordUI) {
        try { mod.unmountWordUI(rootEl) } catch (e) {}
      }
      rootEl = document.getElementById('root')
      rootEl.innerHTML = ''
      let bin = null
      if (opts.fileId) {
        const dlName = encodeURIComponent(opts.fileName || 'document.docx')
        const resp = await fetch('/api/office/download/' + encodeURIComponent(opts.fileId) + '/' + dlName + '?api_key=' + (opts.apiKey || 'dev-key-001'))
        if (!resp.ok) throw new Error('下载文件失败 HTTP ' + resp.status)
        bin = new Uint8Array(await resp.arrayBuffer())
      }
      mod.mountWordUI(rootEl, {
        fileId: opts.fileId || undefined,
        fileName: opts.fileName || 'untitled.docx',
        apiKey: opts.apiKey || 'dev-key-001',
        buffer: bin || undefined,
      })
      // ACMS 补丁：等 React 渲染完后注入 ACMS AI 按钮 + 隐藏 ACMS AI
      setTimeout(startAcmsAiPatchLoop, 800)
      return { ok: true }
    } catch (e) {
      console.error('[genoffice-host] __init 失败:', e)
      return { ok: false, error: e.message }
    }
  }

  window.__unmount = function () {
    stopAcmsAiPatchLoop()
    try {
      if (rootEl && mod && mod.unmountWordUI) mod.unmountWordUI(rootEl)
    } catch (e) {}
    rootEl = null
  }

  // 父窗口 ready 后由 bridge 主动调用 __init
  window.__ready = true
</script>
