<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GenOffice Word Host</title>
<link rel="stylesheet" href="/client/lib/office-v3/word-ui/acms-office-word-ui.css?v=0.96.8">
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;}#root{height:100vh;}</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  // iframe host：由父窗口（ACMS office-v3-bridge）调用 __init/__unmount
  let mod = null
  let rootEl = null
  let acmsAiPatchInterval = null
  // P200: 当前文档标识 —— 角色/场景档案库按文档隔离的依据（__init 时赋值）
  let acmsDocId = ''
  let acmsDocName = ''

  // ── ACMS 补丁 (v0.96.3)：替换 GenSpark 内嵌 AI 按钮 → ACMS AI 入口 ──────
  //   调研发现 (2026-08-15)：
  //   1. GenSpark 是 GenOffice bundle 内嵌的 GenSpark UI 框架（ribbon + 面板 React state + 消息流 + 命令协议）
  //      框架齐全，但 bundle 里的 chat runner 类 `class DX { constructor(t){} ... }` 是空 stub，
  //      transport `zX()` 也返回 `{ send(){}, onMessage(){} }` —— **整个 AI 调用层空跑**。
  //   2. H 函数（按钮 click handler）走完 state 设置后调 `ut.run(...)`，ut 是 DX 实例，
  //      没有 run 方法 → Promise reject → busy=true 卡死 → "思考中" 永远。
  //   3. 用户希望：保留 GenSpark UI，只把大模型那块换成 ACMS Buddy（office_edit 链路已通）。
  //   修法（v0.96.3）：不劫持 click、不接管 React state、不动 prompt 模板。
  //   **通过 React fiber 找到 Gee 组件 + et runner ref，给 runner 补全 run/busy/cancel/reset 方法**。
  //   我们的 run 方法：调 ACMS Buddy office-action + 应用到 Word + 更新聊天消息列表。
  //   GenSpark 自身的 UI（按钮、面板、消息流、思考中动效）继续原样运行，只是背后的"大脑"换了。
  //   GenOffice React re-mount 会重建 DOM，所以补丁要做成轮询（参考 word-open-patch-2026-08-14）。
  function openAcmsBuddy() {
    try {
      var parentACMS = window.parent && window.parent.ACMS;
      if (parentACMS && parentACMS.Buddy) {
        if (typeof parentACMS.Buddy.setView === 'function') {
          parentACMS.Buddy.setView('office-v3-word');
        }
        if (typeof parentACMS.Buddy.togglePanel === 'function') {
          parentACMS.Buddy.togglePanel();
          return true;
        }
      }
      console.warn('[acms-host]] GenSpark 按钮 → 调起 ACMS Buddy');
      console.warn('[acms-host] parent.ACMS.Buddy 未就绪');
    } catch(err) {
      console.warn('[acms-host] openAcmsBuddy err:', err);
    }
    return false;
  }

  // 通过 React fiber 找 Gee 组件（AI 面板），定位 chat state setter + runner ref
  function findGeeFiber(rootEl) {
    // 找任何一个有 React fiber 的 AI panel 元素
    var candidates = rootEl.querySelectorAll('.ai-panel-header, .ai-panel-title, .ai-header-btn, [class*="ai-panel-"]');
    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      var fiberKey = Object.keys(el).find(function(k) { return k.indexOf('__reactFiber') === 0; });
      if (!fiberKey) continue;
      var f = el[fiberKey];
      // walk up to find Gee component
      while (f) {
        if (f.type && typeof f.type === 'function' && f.type.name === 'Gee') return f;
        f = f.return;
      }
    }
    return null;
  }

  // 从 Gee 的 hook 链里按声明顺序找特定 hook
  function getHookAtIndex(fiber, idx) {
    var hook = fiber.memoizedState;
    for (var i = 0; i < idx && hook; i++) {
      hook = hook.next;
    }
    return hook;
  }

  // patch runner + 绑全局方便后续 runner 重建后重新 patch
  function patchACMSAiRunner() {
    var rootEl = document.getElementById('root');
    if (!rootEl) return false;
    var fiber = findGeeFiber(rootEl);
    if (!fiber) return false;

    // Gee 组件 hooks（React 19 实测结构，2026-08-15 浏览器验证）：
    //   useState → memoizedState = 值本身；setter = hook.queue.dispatch（不是 [value,setter] 数组！）
    //   useRef   → memoizedState = { current: ... }
    // hook 0: 输入框文本 (string)     hook 1: busy (false)
    // hook 3: 聊天消息 ([])           hook 4: 附件 ([])
    // hook 39: et runner ref（DX 实例：空对象 + start/stop/send 方法）
    var hook = fiber.memoizedState;
    var etRef = null;
    var chatSetter = null;
    var busySetter = null;
    var seenEmptyArraySetters = 0;
    while (hook) {
      var ms = hook.memoizedState;
      var q = hook.queue;
      // useState：React 19 值本身 + queue.dispatch 才是 setter
      if (q && typeof q.dispatch === 'function') {
        if (ms === false && !busySetter) {
          busySetter = q.dispatch;  // hook 1: busy 状态
        }
        if (Array.isArray(ms) && ms.length === 0) {
          seenEmptyArraySetters++;
          // 第一个 [] 是 chat messages (hook 3)，第二个是 attachments (hook 4)
          if (seenEmptyArraySetters === 1 && !chatSetter) chatSetter = q.dispatch;
        }
      }
      // useRef: object with .current — et 的 current 是 DX 实例
      // 特征：空对象 + 有 start/stop/send 方法（constructor 是 DX class，不是 Object！）
      if (ms && typeof ms === 'object' && 'current' in ms && !Array.isArray(ms)) {
        var c = ms.current;
        if (c && typeof c === 'object' && !Array.isArray(c) &&
            typeof c.start === 'function' && typeof c.stop === 'function' && typeof c.send === 'function') {
          etRef = ms;
          break;
        }
      }
      hook = hook.next;
    }

    if (!etRef || !etRef.current) {
      if (!window.__acmsWarnedNoRunner) {
        window.__acmsWarnedNoRunner = true;
        console.warn('[acms-host] 没找到 et runner ref（panel 可能还没渲染）');
      }
      return false;
    }
    var runner = etRef.current;
    if (runner.__acmsPatched) return true;  // 幂等：同一 runner 不重复 patch
    window.__acmsEtRef = etRef;
    window.__acmsChatSetter = chatSetter;
    window.__acmsBusySetter = busySetter;

    // v0.96.8b: 选区缓存——用户在面板输入指令时编辑器失焦，实时读 selection 会拿到 empty。
    // 监听 selectionUpdate 把最近的非空选区缓存到 window.__acmsSelCache，runner.run 时回退用。
    // （对齐 GenOffice 开源实现：DX runner 内部同样缓存 selection scope）
    try {
      var ce0 = document.querySelector('[contenteditable="true"]');
      var ed0 = ce0 && (ce0.editor || ce0._tiptapEditor);
      if (ed0 && !ed0.__acmsSelWatched) {
        ed0.__acmsSelWatched = true;
        ed0.on('selectionUpdate', function () {
          try {
            var s = ed0.state.selection;
            if (s && !s.empty) {
              window.__acmsSelCache = { from: s.from, to: s.to, at: Date.now() };
            }
          } catch (e) { /* ignore */ }
        });
        // 初始捕获一次（可能面板打开前已选中）
        try {
          var s0 = ed0.state.selection;
          if (s0 && !s0.empty) window.__acmsSelCache = { from: s0.from, to: s0.to, at: Date.now() };
        } catch (e) { /* ignore */ }
        console.info('[acms-host] ✅ selection 缓存监听已挂载');
      }
    } catch (e) {
      console.warn('[acms-host] 挂 selection 监听失败:', e.message);
    }

    // 给 runner 补全方法
    runner._busy = false;
    Object.defineProperty(runner, 'busy', {
      get: function() { return runner._busy; },
      set: function(v) { runner._busy = v; },
      configurable: true
    });

    runner.run = async function(message, attachments) {
      runner._busy = true;
      if (busySetter) try { busySetter(true); } catch(_) {}
      console.info('[acms-host] GenSpark 消息 → ACMS Buddy:', message);

      // 构造 docContext（从 Tiptap editor 抽 blocks，带格式信息供排版/润色）
      // v0.96.8: 支持选区——选中部分文字后，润色/排版/翻译只作用于选中的 blocks
      // v0.96.9: 抽取为公共函数 buildAcmsDocContext（runner 与右键菜单共用），
      //          新增 textStyle（字号/颜色/字体/高亮）聚合 + selectionText（选中文字原文）
      var ctx = buildAcmsDocContext();
      var docContext = ctx ? ctx.doc : { blocks: [] };
      var selBlockIdx = ctx ? ctx.selBlockIdx : [];

      // 有选区时在 instruction 里显式声明（对齐开源实现：rewrite-style requests apply to the selection）
      var finalInstruction = message;
      if (selBlockIdx.length) {
        finalInstruction = message + '\n【用户已选中以下段落（blockIdx=' + selBlockIdx.join(',') + '），只修改选中的段落，不要动其他内容】';
        console.info('[acms-host] 选区 blocks:', selBlockIdx.join(','));
      }

      // P198: 走流式（SSE）— 长文生成时 chunk 实时插入 Word + chat message 实时更新进度
      var summary = '';
      var errMsg = null;
      var detectedOp = null;
      var action = null;
      var streamChars = 0;
      var acmsAbort = null;
      try {
        acmsAbort = new AbortController();
        var streamRet = await acmsCallOfficeActionStream({
          docContext: docContext,
          instruction: finalInstruction,
          signal: acmsAbort.signal,
          onMeta: function (data) {
            detectedOp = data.op;
            // 实时更新 chat message — 「正在生成 XXX (op=appendAll)」
            if (chatSetter) {
              try {
                chatSetter(function (prev) {
                  var next = prev.slice();
                  for (var i = next.length - 1; i >= 0; i--) {
                    if (next[i].role === 'assistant' && next[i].streaming) {
                      next[i] = { ...next[i], text: '⏳ 正在生成（' + detectedOp + '）...' };
                      break;
                    }
                  }
                  return next;
                });
              } catch (_) { }
            }
          },
          onChunk: function (data) {
            streamChars = data.chars || streamChars;
            // 实时插入到 Word 文档末尾（host.html 自己在 word-ui iframe 内，直接拿编辑器）
            try {
              var ce = document.querySelector('[contenteditable="true"]');
              var ed = ce && (ce.editor || ce._tiptapEditor);
              if (ed && data.text) {
                ed.commands.focus('end');
                ed.chain().insertContentAt(ed.state.doc.content.size, data.text).run();
              }
            } catch (_) { }
            // 更新 chat message 进度
            if (chatSetter) {
              try {
                chatSetter(function (prev) {
                  var next = prev.slice();
                  for (var i = next.length - 1; i >= 0; i--) {
                    if (next[i].role === 'assistant' && next[i].streaming) {
                      next[i] = { ...next[i], text: '⏳ 正在生成... 已写入 ' + streamChars + ' 字' };
                      break;
                    }
                  }
                  return next;
                });
              } catch (_) { }
            }
          },
          onError: function (data) {
            errMsg = data.message || 'LLM 流式错误';
          }
        });
        action = streamRet.action;
        detectedOp = streamRet.detectedOp || detectedOp;
      } catch (e) {
        errMsg = e.message || '请求失败';
        console.warn('[acms-host] office-action 流式异常:', e);
      }

      // P198: chunk 已实时插入 appendAll/insertAfter/insertAfterSelection 的内容，runAction 不重复执行这些 op
      //   其他 op（proposeEdit / formatOps / generateImage / insertImagesAtContent 等）走 runAction
      var skipRunAction = detectedOp && /(appendAll|insertAfter|insertAfterSelection)/.test(detectedOp);
      if (!errMsg && action && action.op && !skipRunAction) {
        // ⚠️ 应用到 Word — 入口是父窗口 OfficeV3.runAction
        // ⚠️ 不要用 parent.ACMS.Buddy.runAction（不存在）
        if (window.parent.OfficeV3 && typeof window.parent.OfficeV3.runAction === 'function') {
          try {
            var r = await window.parent.OfficeV3.runAction(action);
            if (r && r.ok) {
              summary = (action.summary || 'AI 已应用编辑') + '（已写入 Word）';
            } else {
              // runAction 失败 — chunk 已实时插入的内容**不会回滚**（Tiptap 历史保留），但提示错误
              errMsg = (r && r.error) || 'Word 应用失败';
              if (streamChars > 0) errMsg += '（前 ' + streamChars + ' 字已实时插入，请用 Ctrl+Z 回滚）';
            }
          } catch (e) {
            errMsg = 'runAction 异常: ' + e.message;
          }
        } else {
          errMsg = 'parent.OfficeV3.runAction 不可用';
        }
      } else if (!errMsg && action && skipRunAction) {
        // appendAll 等：chunk 已插入，summary 拼接字数
        summary = (action.summary || '已追加到 Word') + '（共 ' + streamChars + ' 字）';
      } else if (errMsg && streamChars > 0) {
        errMsg += '（前 ' + streamChars + ' 字已实时插入，请用 Ctrl+Z 回滚）';
      }

      // 更新聊天消息列表 — 把最后那条 streaming assistant message 替换成完成提示
      if (chatSetter) {
        try {
          chatSetter(function(prev) {
            var next = prev.slice();
            for (var i = next.length - 1; i >= 0; i--) {
              if (next[i].role === 'assistant' && next[i].streaming) {
                next[i] = {
                  ...next[i],
                  streaming: false,
                  text: errMsg ? ('❌ ' + errMsg) : ('✅ ' + summary)
                };
                break;
              }
            }
            return next;
          });
        } catch (e) { console.warn('[acms-host] 更新聊天消息失败:', e.message); }
      }

      runner._busy = false;
      if (busySetter) try { busySetter(false); } catch(_) {}
    };

    runner.cancel = function() {
      runner._busy = false;
      if (busySetter) try { busySetter(false); } catch(_) {}
    };

    runner.reset = function() {
      runner._busy = false;
    };

    runner.__acmsPatched = true;
    console.info('[acms-host] ✅ GenSpark runner patched → ACMS Buddy 接管');
    return true;
  }

  // ── v0.96.9: 公共 docContext 抽取（runner.run 与右键菜单共用）──
  // 返回 { doc, selBlockIdx }；doc.blocks 带格式信息（type/level/kind/align/indentFirstLine/marks/textStyle），
  // doc.selectionText = 选中区域精确文本（供 LLM 润色/总结/插图）；选区实时读，失焦回退 __acmsSelCache
  function buildAcmsDocContext() {
    var docContext = { blocks: [] };
    var selBlockIdx = [];
    try {
      var ce = document.querySelector('[contenteditable="true"]');
      if (ce && ce.editor && ce.editor.state && ce.editor.state.doc) {
        var blockIdx = 0;
        var sel = ce.editor.state.selection;
        var selFrom = -1, selTo = -1;
        if (sel && !sel.empty) { selFrom = sel.from; selTo = sel.to; }
        else if (window.__acmsSelCache) { selFrom = window.__acmsSelCache.from; selTo = window.__acmsSelCache.to; }
        ce.editor.state.doc.content.forEach(function(node, nodeOffset) {
          var n = node.type.name;
          if (n === 'docParagraph' || n === 'docHeading' || n === 'docListItem') {
            var b = { i: blockIdx, text: node.textContent.slice(0, 200), type: n };
            var attrs = node.attrs || {};
            if (n === 'docHeading') b.level = attrs.level != null ? attrs.level : 1;
            if (n === 'docListItem') b.kind = attrs.kind || 'bullet';
            if (attrs.align) b.align = attrs.align;
            if (attrs.indentFirstLine) b.indentFirstLine = attrs.indentFirstLine;
            var hasM = { bold: false, italic: false, underline: false, strike: false };
            var textStyle = null;
            node.content && node.content.forEach(function (tn) {
              if (!tn.marks) return;
              tn.marks.forEach(function (m) {
                var mn = m.type && m.type.name;
                if (mn === 'bold') hasM.bold = true;
                else if (mn === 'italic') hasM.italic = true;
                else if (mn === 'underline') hasM.underline = true;
                else if (mn === 'strike') hasM.strike = true;
                else if (mn === 'docTextStyle') {
                  // v0.96.9: docTextStyle 聚合（字号/颜色/字体/高亮）——排版指令需要感知
                  var ta = m.attrs || {};
                  textStyle = textStyle || {};
                  if (ta.sizeHalfPoints != null) textStyle.sizeHalfPoints = ta.sizeHalfPoints;
                  if (ta.color) textStyle.color = ta.color;
                  if (ta.font) textStyle.font = ta.font;
                  if (ta.highlight) textStyle.highlight = ta.highlight;
                }
              });
            });
            if (hasM.bold || hasM.italic || hasM.underline || hasM.strike) b.marks = hasM;
            if (textStyle) b.textStyle = textStyle;
            // 选区覆盖检测：block 的 [offset, offset+nodeSize] 与选区 [from,to] 有交集即视为选中
            if (selFrom >= 0 && selTo > selFrom) {
              var nStart = nodeOffset;
              var nEnd = nodeOffset + node.nodeSize;
              if (nEnd > selFrom && nStart < selTo) {
                b.selected = true;
                selBlockIdx.push(blockIdx);
              }
            }
            docContext.blocks.push(b);
            blockIdx++;
          }
        });
        docContext.selBlockIdx = selBlockIdx;
        // v0.96.9: 选中文字原文（精确字符级，供润色/总结/插图生成器）
        if (selFrom >= 0 && selTo > selFrom) {
          try {
            var selText = ce.editor.state.doc.textBetween(selFrom, selTo, '\n');
            if (selText) docContext.selectionText = selText.slice(0, 500);
          } catch (e) { /* ignore */ }
        }
      }
    } catch (e) { console.warn('[acms-host] 抽 docContext 失败:', e.message); }
    return { doc: docContext, selBlockIdx: selBlockIdx };
  }

  // P200: host.html 运行在 iframe 内，而 character/scene-library.js 与 visual-bible.js 加载在主窗口
  //   所以先查 window（同窗口场景），回退 window.parent（iframe 场景）
  function acmsLib(name) {
    try {
      if (window[name]) return window[name];
      if (window.parent && window.parent !== window && window.parent[name]) return window.parent[name];
    } catch (e) { /* 跨域/沙箱 */ }
    return null;
  }

  // P200: 抽取文档全文（不截断 — 视觉设定集分析用）
  //   与 buildAcmsDocContext 的区别：那个每段 slice(0,200) 供 LLM 决策，这个要全文
  function buildAcmsFullText() {
    try {
      var ce = document.querySelector('[contenteditable="true"]');
      var editor = ce && (ce.editor || ce._tiptapEditor);
      if (!editor || !editor.state || !editor.state.doc) return '';
      var parts = [];
      editor.state.doc.content.forEach(function (node) {
        var n = node.type.name;
        if (n === 'docParagraph' || n === 'docHeading' || n === 'docListItem') {
          var t = String(node.textContent || '').trim();
          if (t) parts.push(t);
        }
      });
      return parts.join('\n\n');
    } catch (e) {
      console.warn('[acms-host] buildAcmsFullText 失败:', e.message);
      return '';
    }
  }

  // v0.96.9b: 右键 AI 动作（润色/排版/总结/生成插图）──
  // 注：v0.96.9 曾用自定义菜单替换原生右键菜单，用户指出应保留原生菜单、只在其上添加 AI 选项。
  // v0.96.9b 改为：不拦截原生右键（.ctx-menu 照常弹出），往菜单末尾注入 AI 动作项。

  // P198: 流式调 office-action（SSE 协议解析）
  // opts: { docContext, instruction, onMeta, onChunk, onDone, onError, signal }
  //   onMeta({op}) — LLM 输出首个 { 后触发（含 op 类型）
  //   onChunk({text, chars}) — 每 150 字 newText 增量触发
  //   onDone({action}) — 流结束 + 完整 action
  //   onError({message}) — 错误
  // 返回 { action, detectedOp } 或 throw Error
  async function acmsCallOfficeActionStream(opts) {
    var docContext = opts.docContext;
    var instruction = opts.instruction;
    var onMeta = opts.onMeta;
    var onChunk = opts.onChunk;
    var onDone = opts.onDone;
    var onError = opts.onError;
    var signal = opts.signal;
    var resp = await fetch('/api/agent-buddy/office-action?api_key=dev-key-001&stream=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': 'dev-key-001' },
      body: JSON.stringify({ kind: 'word', instruction: instruction, docContext: docContext }),
      signal: signal
    });
    if (!resp.ok || !resp.body) {
      var errText = await resp.text().catch(function () { return 'HTTP ' + resp.status; });
      throw new Error('office-action HTTP ' + resp.status + ': ' + errText.slice(0, 200));
    }
    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buf = '';
    var action = null;
    var errorMsg = null;
    var detectedOp = null;
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += decoder.decode(r.value, { stream: true });
      // 按 \n\n 分块 — 每个 SSE event 是单独块
      var events = buf.split('\n\n');
      buf = events.pop() || '';
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        var m = ev.match(/^event:\s*(.+)\ndata:\s*([\s\S]+)$/);
        if (!m) continue;
        var evName = m[1].trim();
        var data;
        try { data = JSON.parse(m[2]); } catch (_) { continue; }
        if (evName === 'meta') {
          detectedOp = data.op;
          if (onMeta) try { onMeta(data); } catch (_) {}
        } else if (evName === 'chunk') {
          if (onChunk) try { onChunk(data); } catch (_) {}
        } else if (evName === 'done') {
          action = data.action;
          if (onDone) try { onDone(data); } catch (_) {}
        } else if (evName === 'error') {
          errorMsg = data.message || 'LLM 流式错误';
          if (onError) try { onError(data); } catch (_) {}
        }
      }
    }
    if (errorMsg) throw new Error(errorMsg);
    if (!action || !action.op) throw new Error('流式响应未返回有效 action');
    return { action: action, detectedOp: detectedOp };
  }

  // 右键动作执行（润色/排版/总结/生成插图）——与 runner.run 同构：instruction → office-action → OfficeV3.runAction
  async function acmsRunSelectionAction(type) {
    var ctx = buildAcmsDocContext();
    if (!ctx || !ctx.selBlockIdx || !ctx.selBlockIdx.length) {
      showAcmsToast('⚠️ 请先在文档中选中文字', 'warn');
      return;
    }
    var instruction = '';
    if (type === 'polish') instruction = '对选中的文字进行润色，使表达更清晰、流畅、专业。把润色结果插入到选中区域之后（不修改原文）。';
    else if (type === 'format') instruction = '整理选中段落的排版（标题层级、列表、加粗斜体下划线、字号、字体、颜色、高亮、对齐、缩进、行距等），只调整格式，不要改动任何文字内容。';
    else if (type === 'summarize') instruction = '总结选中的文字，生成简洁的摘要，插入到选中区域之后（不修改原文）。';
    else if (type === 'image') instruction = '根据选中的文字生成一张插图（配图），用于文生图。';
    else return;
    showAcmsToast('⏳ 正在处理…', 'info');
    try {
      // P198: 走流式（SSE）— 短 op 也走 streaming（只发 meta+done，不发 chunk，行为一致）
      var streamRet = await acmsCallOfficeActionStream({
        docContext: ctx.doc,
        instruction: instruction,
        onError: function (e) { showAcmsToast('❌ ' + (e.message || '生成失败'), 'error'); }
      });
      var action = streamRet.action;
      var r = await window.parent.OfficeV3.runAction(action);
      if (r && r.ok) {
        showAcmsToast('✅ ' + (action.summary || r.summary || '完成'), 'ok');
      } else {
        showAcmsToast('❌ ' + ((r && r.error) || '执行失败'), 'error');
      }
    } catch (e) {
      showAcmsToast('❌ ' + e.message, 'error');
      console.warn('[acms-host] 右键动作异常:', e);
    }
  }

    var acmsUnassignedCount = 0; // 未绑定档案数（角色+场景）— 空态提示用

              for (var i = 0; i < names.length; i++) {
                var nm = String(names[i] || '').trim();
                if (nm && fullText.indexOf(nm) >= 0) return true;
              }
              return false;
            });
          }
          var hc = hitsOf(uChars), hs = hitsOf(uScenes);
          if (!hc.length && !hs.length) {
            showAcmsToast('🔍 本文档里没找到未绑定档案的名字（共 ' + (uChars.length + uScenes.length) + ' 个待归属）', 'warn', 3600);
            return;
          }
          return Promise.all([
            (cl && hc.length) ? cl.assignDoc(hc.map(function (x) { return x.id; }), acmsDocId, acmsDocName) : Promise.resolve(),
            (sl && hs.length) ? sl.assignDoc(hs.map(function (x) { return x.id; }), acmsDocId, acmsDocName) : Promise.resolve()
          ]).then(function () {
            var names = hc.map(function (x) { return x.name; }).concat(hs.map(function (x) { return x.name; }));
            var rest = (uChars.length + uScenes.length) - names.length;
            showAcmsToast('✅ 已认领 ' + names.length + ' 个：' + names.slice(0, 6).join('、') +
              (names.length > 6 ? '…' : '') + (rest > 0 ? '（还有 ' + rest + ' 个待在其他文章里认领）' : ''), 'ok', 4200);
            reloadChars();
            reloadScenes();
          });
        }).catch(function (e) {
          showAcmsToast('❌ ' + e.message, 'error', 3200);
        });
      };
      scopeHint.querySelector('.acms-scope-assign').onclick = function () {
        scopeHint.style.display = 'none';
        var cl = acmsLib('acmsCharacterLib');
        var sl = acmsLib('acmsSceneLib');
        Promise.all([
          cl ? cl.assignDoc([], acmsDocId, acmsDocName) : Promise.resolve(),
          sl ? sl.assignDoc([], acmsDocId, acmsDocName) : Promise.resolve()
        ]).then(function () {
          showAcmsToast('✅ 已归到本文档「' + (acmsDocName || '当前文档') + '」', 'ok', 2600);
          reloadChars();
          reloadScenes();
        }).catch(function (e) {
          showAcmsToast('❌ 归属失败: ' + e.message, 'error', 3500);
        });
      };
      scopeHint.querySelector('.acms-scope-dismiss').onclick = function () { scopeHintDismissed = true; scopeHint.style.display = 'none'; };
      if (scopeHintDismissed) scopeHint.style.display = 'none';
    }

    // 统计未绑定数量（角色 + 场景），用于提示条
    function countUnassigned() {
      var cl = acmsLib('acmsCharacterLib');
      var sl = acmsLib('acmsSceneLib');
      var p1 = (cl && cl.list) ? cl.list(null, 'unassigned').then(function (r) { return ((r.data && r.data.characters) || []).length; }).catch(function () { return 0; }) : Promise.resolve(0);
      var p2 = (sl && sl.list) ? sl.list(null, 'unassigned').then(function (r) { return ((r.data && r.data.scenes) || []).length; }).catch(function () { return 0; }) : Promise.resolve(0);
      return Promise.all([p1, p2]).then(function (arr) { return (arr[0] || 0) + (arr[1] || 0); });
    }

    // 「未绑定」tab 可见性 + 计数
    function syncScopeTabs(nUnassigned) {
      var btn = panel.querySelector('.acms-scope-btn[data-scope="unassigned"]');
      if (!btn) return;
      var nEl = btn.querySelector('.acms-scope-n');
      if (nEl) nEl.textContent = String(nUnassigned || 0);
      btn.style.display = (nUnassigned > 0) ? '' : 'none';
    }

    // P200: 触发时机 B — 档案库全空时提示先建设定集（两个库都加载完后才判断）
    //   库非空 → 触发 AI 自动匹配（阶段 2）；库全空 → 提示建设定集
    var hintTimer = null;
    var autoMatchDone = false;
    function scheduleHintCheck() {
      if (hintTimer) clearTimeout(hintTimer);
      hintTimer = setTimeout(function () {
        var hintEl = panel.querySelector('.acms-panel-bible-hint');
        if (!hintEl) return;
        if (allChars.length > 0 || allScenes.length > 0) {
          hintEl.style.display = 'none';
          // 两库都已加载且有内容 → 触发一次 AI 自动匹配
          if (!autoMatchDone) { autoMatchDone = true; autoMatchSegment(); }
          return;
        }
        hintEl.style.display = 'block';
        hintEl.style.cssText = 'display:block;margin:10px 16px 0;padding:9px 11px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:6px;font-size:12px;color:#4a148c;line-height:1.6;';
        hintEl.innerHTML =
          '📌 本文还没建立视觉设定集 —— 第一次配图建议先建（AI 自动从全文抽取人物/场景，生成统一风格的设定图，之后所有插图自动保持一致）。' +
          '<button class="acms-panel-make-bible" type="button" style="display:block;margin-top:7px;padding:5px 12px;background:#9c27b0;color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;">🎬 立即生成设定集</button>';
        hintEl.querySelector('.acms-panel-make-bible').onclick = function () {
          panel.style.display = 'none';
          runFullBibleFlow();
        };
      }, 120);
    }

    function renderChars() {
      if (!allChars.length) {
        // P200: 区分「真的没有」和「本文档没有但别处有未绑定的」—— 后者要让用户知道档案没丢
        var emptyMsg;
        if (acmsScope === 'doc' && acmsUnassignedCount > 0) {
          emptyMsg = '本文档还没有角色档案。<br/>另有 <b>' + acmsUnassignedCount + '</b> 个档案未绑定文档（不在此显示）。<br/>点上面「按本文档认领」自动匹配，或切到「全部」。';
        } else if (acmsScope === 'doc') {
          emptyMsg = '本文档还没有角色档案。点「+ 新建」创建，第二次生图时复用 → 人物一致';
        } else {
          emptyMsg = '角色库为空。点「+ 新建」创建第一个角色，第二次生图时复用 → 人物/环境一致';
        }
        charsContainer.innerHTML = '<div class="acms-panel-chars-empty">' + emptyMsg + '</div>';
        return;
      }
      charsContainer.innerHTML = allChars.map(function (c) {
        var isSel = !!selectedCharIds[c.id];
        var imgHtml = c.referenceImage
          ? '<img class="acms-char-thumb" src="' + acmsEscapeHtml(c.referenceImage) + '" alt=""/>'
          : '<span class="acms-char-thumb-empty">无图</span>';
        var aliasStr = (c.aliases && c.aliases.length) ? ' <span class="acms-char-alias">（' + acmsEscapeHtml(c.aliases.join('/')) + '）</span>' : '';
        return '<button class="acms-char-chip' + (isSel ? ' active' : '') + '" data-char-id="' + c.id + '" type="button">' +
                 imgHtml +
                 '<span class="acms-char-info">' +
                   '<span class="acms-char-name">' + acmsEscapeHtml(c.name) + aliasStr + '</span>' +
                   (c.description ? '<span class="acms-char-desc">' + acmsEscapeHtml(c.description.slice(0, 50)) + (c.description.length > 50 ? '…' : '') + '</span>' : '') +
                 '</span>' +
               '</button>';
      }).join('');
      charsContainer.querySelectorAll('.acms-char-chip').forEach(function (chip) {
        chip.onclick = function () {
          var id = chip.getAttribute('data-char-id');
          if (selectedCharIds[id]) {
            delete selectedCharIds[id];
            chip.classList.remove('active');
          } else {
            var c = allChars.find(function (x) { return x.id === id; });
            if (c) selectedCharIds[id] = c;
            chip.classList.add('active');
          }
        };
      });
    }

    function reloadChars() {
      if (!acmsLib('acmsCharacterLib') || !acmsLib('acmsCharacterLib').list) {
        charsContainer.innerHTML = '<div class="acms-panel-chars-empty">角色库 API 未加载</div>';
        return;
      }
      acmsLib('acmsCharacterLib').list(acmsDocId, acmsScope).then(function (resp) {
        allChars = (resp && resp.data && resp.data.characters) || [];
        // 智能匹配：选中文字里含角色名/别名 → 自动勾选
        if (selText && allChars.length) {
          for (var i = 0; i < allChars.length; i++) {
            var c = allChars[i];
            var names = [c.name].concat(c.aliases || []);
            var hit = false;
            for (var j = 0; j < names.length; j++) {
              var n = String(names[j] || '').trim();
              if (n && selText.indexOf(n) >= 0) { hit = true; break; }
            }
            if (hit && c.referenceImage) selectedCharIds[c.id] = c; // 只勾有参考图的
          }
        }
        renderChars();
        scheduleHintCheck();
        countUnassigned().then(function (n) {
          acmsUnassignedCount = n || 0;
          syncScopeTabs(n);
          refreshScopeHint(n);
          // 未绑定数影响空态文案 → 拿到后重渲染一次
          if (!allChars.length || !allScenes.length) { renderChars(); renderScenes(); }
        });
      }).catch(function (e) {
        charsContainer.innerHTML = '<div class="acms-panel-chars-empty">加载失败: ' + acmsEscapeHtml(e.message) + '</div>';
      });
    }

    reloadChars();

    function renderScenes() {
      if (!allScenes.length) {
        var emptyMsgS;
        if (acmsScope === 'doc' && acmsUnassignedCount > 0) {
          emptyMsgS = '本文档还没有场景档案。<br/>另有 <b>' + acmsUnassignedCount + '</b> 个档案未绑定文档（不在此显示）。<br/>点上面「按本文档认领」自动匹配，或切到「全部」。';
        } else if (acmsScope === 'doc') {
          emptyMsgS = '本文档还没有场景档案。点「+ 新建」创建场景（古镇/江湖客栈/竹林等），生图时复用 → 环境一致';
        } else {
          emptyMsgS = '场景库为空。点「+ 新建」创建场景（古镇/江湖客栈/竹林等），生图时复用 → 环境一致';
        }
        scenesContainer.innerHTML = '<div class="acms-panel-scenes-empty">' + emptyMsgS + '</div>';
        return;
      }
      scenesContainer.innerHTML = allScenes.map(function (s) {
        var isSel = s.id === selectedSceneId;
        var imgHtml = s.referenceImage
          ? '<img class="acms-char-thumb" src="' + acmsEscapeHtml(s.referenceImage) + '" alt=""/>'
          : '<span class="acms-char-thumb-empty">无图</span>';
        return '<button class="acms-char-chip' + (isSel ? ' active' : '') + '" data-scene-id="' + s.id + '" type="button">' +
                 imgHtml +
                 '<span class="acms-char-info">' +
                   '<span class="acms-char-name">' + acmsEscapeHtml(s.name) + '</span>' +
                   (s.description ? '<span class="acms-char-desc">' + acmsEscapeHtml(s.description.slice(0, 50)) + (s.description.length > 50 ? '…' : '') + '</span>' : '') +
                 '</span>' +
               '</button>';
      }).join('');
      scenesContainer.querySelectorAll('.acms-char-chip').forEach(function (chip) {
        chip.onclick = function () {
          var id = chip.getAttribute('data-scene-id');
          if (selectedSceneId === id) {
            selectedSceneId = null;
            chip.classList.remove('active');
          } else {
            selectedSceneId = id;
            scenesContainer.querySelectorAll('.acms-char-chip').forEach(function (c) { c.classList.remove('active'); });
            chip.classList.add('active');
          }
        };
      });
    }

    function reloadScenes() {
      if (!acmsLib('acmsSceneLib') || !acmsLib('acmsSceneLib').list) {
        scenesContainer.innerHTML = '<div class="acms-panel-scenes-empty">场景库 API 未加载</div>';
        return;
      }
      acmsLib('acmsSceneLib').list(acmsDocId, acmsScope).then(function (resp) {
        allScenes = (resp && resp.data && resp.data.scenes) || [];
        if (selText && allScenes.length) {
          for (var i = 0; i < allScenes.length; i++) {
            var s = allScenes[i];
            var names = [s.name].concat(s.aliases || []);
            for (var j = 0; j < names.length; j++) {
              var n = String(names[j] || '').trim();
              if (n && selText.indexOf(n) >= 0 && s.referenceImage) { selectedSceneId = s.id; break; }
            }
            if (selectedSceneId) break;
          }
        }
        renderScenes();
        scheduleHintCheck();
      }).catch(function (e) {
        scenesContainer.innerHTML = '<div class="acms-panel-scenes-empty">加载失败: ' + acmsEscapeHtml(e.message) + '</div>';
      });
    }

    reloadScenes();

    // ── P200 阶段 2：AI 自动匹配 —— 选段后自动勾选相关角色/场景 + 预填镜头描述 ──
    //   浮窗本身就是确认卡：AI 预填 → 用户可改勾选/改描述 → 点生成
    function autoMatchSegment() {
      if (!selText || selText.length < 4) return;
      if (!acmsLib('acmsVisualBible') || !acmsLib('acmsVisualBible').matchSegment) return;
      if (!allChars.length && !allScenes.length) return;
      var bibleMeta = {
        characters: allChars.map(function (c) { return { name: c.name, aliases: c.aliases || [], description: c.description || '' }; }),
        scenes: allScenes.map(function (s) { return { name: s.name, aliases: s.aliases || [], description: s.description || '' }; })
      };
      var hintEl = panel.querySelector('.acms-panel-bible-hint');
      var matchTimer = setTimeout(function () {
        if (hintEl) {
          hintEl.style.display = 'block';
          hintEl.style.cssText = 'display:block;margin:10px 16px 0;padding:7px 11px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;font-size:12px;color:#1b5e20;';
          hintEl.textContent = '🤖 AI 正在匹配这段文字涉及的角色/场景…';
        }
      }, 400);

      acmsLib('acmsVisualBible').matchSegment(selText, bibleMeta).then(function (resp) {
        clearTimeout(matchTimer);
        if (!resp || !resp.ok) { if (hintEl) hintEl.style.display = 'none'; return; }
        var d = resp.data || {};
        // 1. 勾选匹配到的角色
        var matchedNames = [];
        (d.characters || []).forEach(function (mc) {
          var hit = allChars.find(function (c) { return c.name === mc.name; });
          if (hit && hit.referenceImage) { selectedCharIds[hit.id] = hit; matchedNames.push(hit.name); }
        });
        // 2. 勾选匹配到的场景
        var matchedSceneName = null;
        if (d.scene) {
          var hs = allScenes.find(function (s) { return s.name === d.scene.name; });
          if (hs && hs.referenceImage) { selectedSceneId = hs.id; matchedSceneName = hs.name; }
        }
        renderChars();
        renderScenes();
        // 3. 预填画面描述（仅当用户还没改过 — textarea 仍是初始 selText 时）
        var promptEl = panel.querySelector('.acms-panel-prompt');
        if (promptEl && d.prompt && promptEl.value.trim() === selText.trim()) {
          promptEl.value = d.prompt;
        }
        // 4. 提示匹配结果
        if (hintEl) {
          if (matchedNames.length || matchedSceneName) {
            hintEl.style.display = 'block';
            hintEl.style.cssText = 'display:block;margin:10px 16px 0;padding:7px 11px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;font-size:12px;color:#1b5e20;line-height:1.5;';
            hintEl.innerHTML = '🤖 AI 已匹配：' +
              (matchedNames.length ? '角色「' + acmsEscapeHtml(matchedNames.join('、')) + '」' : '') +
              (matchedSceneName ? (matchedNames.length ? ' · ' : '') + '场景「' + acmsEscapeHtml(matchedSceneName) + '」' : '') +
              (d.shot ? '<br/><span style="color:#2e7d32;">📷 ' + acmsEscapeHtml(d.shot) + '</span>' : '') +
              '<br/><span style="color:#666;">（可手动增减下方勾选，或修改画面描述）</span>';
          } else {
            hintEl.style.display = 'none';
          }
        }
      }).catch(function (e) {
        clearTimeout(matchTimer);
        if (hintEl) hintEl.style.display = 'none';
        console.warn('[visual-bible] match 失败:', e.message);
      });
    }
    // 注意：autoMatchSegment 由 scheduleHintCheck 在两库加载完成后触发（见上），此处不直接调用

    // 「+ 新建角色」入口 — 弹小窗编辑单字段
    panel.querySelector('.acms-panel-add-char').onclick = function () {
      showCharacterQuickCreatePanel({
        anchorPanel: panel,
        onCreated: function (newChar) {
          allChars.push(newChar);
          if (newChar.referenceImage) selectedCharIds[newChar.id] = newChar;
          renderChars();
        }
      });
    };

    // 「+ 新建场景」入口 — 复用同一 quick-create 弹窗（kind='scene'）
    panel.querySelector('.acms-panel-add-scene').onclick = function () {
      showCharacterQuickCreatePanel({
        anchorPanel: panel,
        kind: 'scene',
        onCreated: function (newScene) {
          allScenes.push(newScene);
          if (newScene.referenceImage) {
            selectedSceneId = newScene.id;
            scenesContainer.querySelectorAll('.acms-char-chip').forEach(function (c) { c.classList.remove('active'); });
          }
          renderScenes();
        }
      });
    };

    // P199: 「📚 管理」入口 — 打开角色/场景库管理视图（列表 + 编辑 + 删除）
    panel.querySelector('.acms-panel-manage-char').onclick = function () {
      showLibraryManagerPanel('character');
    };
    panel.querySelector('.acms-panel-manage-scene').onclick = function () {
      showLibraryManagerPanel('scene');
    };

    panel.querySelector('.acms-panel-submit').onclick = function () {
      if (!selectedStyle) { showAcmsToast('⚠️ 请先选择风格', 'warn'); return; }
      var promptText = panel.querySelector('.acms-panel-prompt').value.trim();
      if (!promptText) { showAcmsToast('⚠️ 画面描述不能为空', 'warn'); return; }
      var styleObj = null;
      for (var i = 0; i < ACMS_IMAGE_STYLES.length; i++) {
        if (ACMS_IMAGE_STYLES[i].key === selectedStyle) { styleObj = ACMS_IMAGE_STYLES[i]; break; }
      }
      // 收集已选角色的 referenceImage（多图合成）
      var referenceImages = [];
      var selChars = Object.values(selectedCharIds);
      for (var k = 0; k < selChars.length; k++) {
        if (selChars[k] && selChars[k].referenceImage) referenceImages.push(selChars[k].referenceImage);
      }
      // 收集已选场景的 referenceImage（场景一致性）
      var selScene = selectedSceneId ? allScenes.find(function (s) { return s.id === selectedSceneId; }) : null;
      if (selScene && selScene.referenceImage) referenceImages.push(selScene.referenceImage);
      // prompt 加角色/场景一致性约束（让 LLM 主导 prompt 描述）
      var charNames = selChars.map(function (c) { return c.name; }).filter(Boolean);
      if (charNames.length) {
        promptText = '保持角色「' + charNames.join('、') + '」与各自参考图一致的形象（脸型/发型/服装/气质），' + promptText;
      }
      var sceneName = selScene ? selScene.name : null;
      if (sceneName) {
        promptText = '场景「' + sceneName + '」的环境/构图与参考图保持一致，' + promptText;
      }
      var finalPrompt = styleObj.prefix + promptText;
      close();
      try { onSubmit(finalPrompt, styleObj, referenceImages, charNames, sceneName); } catch (_) { }
    };

    setTimeout(function () {
      document.addEventListener('keydown', escHandler);
      document.addEventListener('mousedown', outsideHandler);
    }, 120);

    document.body.appendChild(panel);
    // P200 修复：定位不能依赖 rect.height —— 角色/场景列表是【异步填充】的，
    //   测量时还是「加载中…」的矮状态，等列表加载完浮窗变高 → 底部按钮溢出视口。
    //   改用「视口剩余空间」算 max-height，保证底部永不出界（配合 actions sticky）。
    var vw = window.innerWidth, vh = window.innerHeight;
    var PANEL_W = 420, GAP = 16;
    var left = anchorX;
    if (left + PANEL_W > vw - 8) left = Math.max(8, vw - PANEL_W - 8);
    if (left < 8) left = 8;
    var top = anchorY;
    // 下方空间不足 360px → 上移，给浮窗留出 ~75vh 的空间
    if (vh - top - GAP < 360) top = Math.max(GAP, vh - Math.round(vh * 0.75) - GAP);
    if (top < GAP) top = GAP;
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    panel.style.maxHeight = Math.max(240, vh - top - GAP) + 'px';

    setTimeout(function () { panel.querySelector('.acms-panel-prompt').focus(); }, 50);
    return { close: close };
  }

  // P199: 快速创建角色/场景面板（浮窗内嵌弹小窗 — 不跳出主浮窗）
  //   上传图片 → 转 dataUrl → 调 acmsCharacterLib.create / acmsSceneLib.create
  //   onCreated(newItem) — 新建成功后回调（外层把 item 加入列表 + 自动勾选）
  //   opts.kind: 'character'（默认）/ 'scene' — 决定存到哪个库
  function showCharacterQuickCreatePanel(opts) {
    var anchorPanel = opts.anchorPanel;
    var onCreated = opts.onCreated || function () { };
    var kind = opts.kind || 'character';
    var isScene = kind === 'scene';
    var apiLib = isScene ? acmsLib('acmsSceneLib') : acmsLib('acmsCharacterLib');
    var editItem = opts.editItem || null;          // P199: 编辑模式（传现有 item）
    var isEdit = !!editItem;
    var prefillImage = opts.prefillImage || (editItem && editItem.referenceImage) || null;
    var prefillName = opts.prefillName || (editItem && editItem.name) || '';
    var prefillAliases = (editItem && editItem.aliases && editItem.aliases.length) ? editItem.aliases.join(', ') : '';
    var prefillDesc = (editItem && editItem.description) || '';
    var nameLabel = isScene ? '场景名 *（例：雨夜驿站、江南水乡）' : '角色名 *';
    var namePlaceholder = isScene ? '例：雨夜驿站' : '例：林风';
    var aliasLabel = isScene ? '别名（逗号分隔，用于智能匹配选中文字）' : '别名（逗号分隔，用于智能匹配选中文字）';
    var aliasPlaceholder = isScene ? '例：驿站, 荒废驿站' : '例：林公子, 林少侠';
    var descLabel = isScene ? '环境/氛围描述' : '外貌/服装描述';
    var descPlaceholder = isScene ? '例：洛阳城外三十里，青石长街，冷雨夜' : '例：约莫二十七八岁，眉目清冷，腰间悬着一柄没有剑鞘的长剑';
    var refLabel = isScene ? '场景参考图（PNG/JPG，多图合成时作为环境/构图参考）' : '参考图（PNG/JPG，做为多图合成的角色参考）';
    var panel = document.createElement('div');
    panel.id = isScene ? 'acms-scene-quick-create' : 'acms-char-quick-create';
    panel.style.cssText = 'position:fixed;z-index:100001;width:380px;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:0;font-family:inherit;border:2px solid rgba(76,175,80,.5);';

    panel.innerHTML =
      '<div class="acms-panel-header" style="background:#f5faf5;">' +
        '<span class="acms-panel-title">' + (isEdit ? '✏️ 编辑' : '+ 新建') + (isScene ? '场景档案' : '角色档案') + '</span>' +
        '<button class="acms-panel-close" type="button">×</button>' +
      '</div>' +
      '<div style="padding:14px 16px;">' +
        '<div style="margin-bottom:8px;"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px;">' + nameLabel + '</label>' +
          '<input class="acms-char-name" type="text" placeholder="' + namePlaceholder + '" value="' + acmsEscapeHtml(prefillName) + '" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;box-sizing:border-box;"/>' +
        '</div>' +
        '<div style="margin-bottom:8px;"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px;">' + aliasLabel + '</label>' +
          '<input class="acms-char-aliases" type="text" placeholder="' + aliasPlaceholder + '" value="' + acmsEscapeHtml(prefillAliases) + '" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;box-sizing:border-box;"/>' +
        '</div>' +
        '<div style="margin-bottom:8px;"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px;">' + descLabel + '</label>' +
          '<textarea class="acms-char-desc" rows="2" placeholder="' + descPlaceholder + '" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px;box-sizing:border-box;resize:vertical;">' + acmsEscapeHtml(prefillDesc) + '</textarea>' +
        '</div>' +
        '<div style="margin-bottom:8px;"><label style="font-size:12px;color:#666;display:block;margin-bottom:3px;">' + refLabel + '</label>' +
          '<input class="acms-char-file" type="file" accept="image/png,image/jpeg,image/jpg" style="font-size:12px;"/>' +
        '</div>' +
        '<div class="acms-char-preview" style="margin-bottom:8px;' + (prefillImage ? '' : 'display:none') + '"><img src="' + acmsEscapeHtml(prefillImage || '') + '" style="max-width:100%;max-height:160px;border-radius:6px;border:1px solid #eee;"/></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
          '<button class="acms-panel-cancel" type="button" style="padding:6px 14px;background:#f5f5f5;border:none;border-radius:5px;font-size:13px;cursor:pointer;">取消</button>' +
          '<button class="acms-panel-save" type="button" style="padding:6px 14px;background:#4caf50;color:#fff;border:none;border-radius:5px;font-size:13px;cursor:pointer;font-weight:500;">保存</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(panel);
    var anchorRect = anchorPanel.getBoundingClientRect();
    var left = anchorRect.right + 8;
    var top = anchorRect.top;
    if (left + 380 > window.innerWidth - 8) left = Math.max(8, anchorRect.left - 380 - 8);
    if (top + 360 > window.innerHeight - 8) top = Math.max(8, window.innerHeight - 360 - 8);
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';

    function close() { panel.remove(); }

    panel.querySelector('.acms-panel-close').onclick = close;
    panel.querySelector('.acms-panel-cancel').onclick = close;

    // 预填图（如果有）
    var imageDataUrl = prefillImage || null;
    var fileInput = panel.querySelector('.acms-char-file');
    var previewEl = panel.querySelector('.acms-char-preview');
    fileInput.onchange = function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) { previewEl.style.display = 'none'; imageDataUrl = null; return; }
      if (f.size > 5 * 1024 * 1024) {
        showAcmsToast('⚠️ 图片过大（>5MB），请压缩后再上传', 'warn');
        fileInput.value = '';
        return;
      }
      var fr = new FileReader();
      fr.onload = function () {
        imageDataUrl = fr.result;
        previewEl.querySelector('img').src = imageDataUrl;
        previewEl.style.display = 'block';
      };
      fr.readAsDataURL(f);
    };

    panel.querySelector('.acms-panel-save').onclick = function () {
      var name = panel.querySelector('.acms-char-name').value.trim();
      if (!name) { showAcmsToast('⚠️ ' + (isScene ? '场景' : '角色') + '名必填', 'warn'); return; }
      var aliasesRaw = panel.querySelector('.acms-char-aliases').value.trim();
      var aliases = aliasesRaw ? aliasesRaw.split(/[,，\s]+/).filter(Boolean) : [];
      var desc = panel.querySelector('.acms-char-desc').value.trim();
      if (!apiLib) {
        showAcmsToast('❌ ' + (isScene ? '场景' : '角色') + '库 API 未加载', 'error'); return;
      }
      var payload = { name: name, aliases: aliases, description: desc, referenceImage: imageDataUrl || null };
      // P200: 新建时打上当前文档标识（按文档隔离）；编辑时不动归属，避免把别的文档的档案抢过来
      if (!isEdit) {
        payload.sourceDocId = acmsDocId;
        payload.sourceDocName = acmsDocName;
      }
      var p;
      if (isEdit && editItem && apiLib.update) {
        p = apiLib.update(editItem.id, payload);
      } else if (apiLib.create) {
        p = apiLib.create(payload);
      } else {
        showAcmsToast('❌ API 方法缺失', 'error'); return;
      }
      p.then(function (resp) {
        if (resp && resp.ok && resp.data) {
          close();
          showAcmsToast('✅ ' + (isScene ? '场景' : '角色') + (isEdit ? '已更新: ' : '已保存: ') + name, 'ok', 2000);
          onCreated(resp.data);
        } else {
          showAcmsToast('❌ ' + (resp && resp.error || '保存失败'), 'error');
        }
      }).catch(function (e) {
        showAcmsToast('❌ ' + e.message, 'error');
      });
    };

    // P199: 如果是从「存为参考」菜单打开的（预填了图），自动 focus 名称输入框 — 用户只需填名+保存
    if (prefillImage) {
      setTimeout(function () {
        var nameInput = panel.querySelector('.acms-char-name');
        if (nameInput) { nameInput.focus(); nameInput.select(); }
      }, 50);
    }
  }

  // P199: 角色/场景库管理视图（列表 + 编辑 + 删除 + 新建）
  //   kind: 'character' | 'scene'
  function showLibraryManagerPanel(kind) {
    kind = kind || 'character';
    var isScene = kind === 'scene';
    var apiLib = isScene ? acmsLib('acmsSceneLib') : acmsLib('acmsCharacterLib');
    var listKey = isScene ? 'scenes' : 'characters';
    var title = isScene ? '🏞️ 场景库管理' : '🎭 角色库管理';
    var itemWord = isScene ? '场景' : '角色';

    var old = document.getElementById('acms-library-manager');
    if (old) old.remove();
    acmsInjectImagePanelCss();

    var panel = document.createElement('div');
    panel.id = 'acms-library-manager';
    panel.setAttribute('data-acms-panel', 'library-manager');
    panel.style.cssText = 'position:fixed;z-index:100000;width:460px;max-height:75vh;overflow-y:auto;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;border:2px solid rgba(33,150,243,.4);';

    var escHandler = function (e) { if (e.key === 'Escape') close(); };
    var outsideHandler = function (e) { if (!panel.contains(e.target)) close(); };
    function close() {
      panel.remove();
      document.removeEventListener('keydown', escHandler);
      document.removeEventListener('mousedown', outsideHandler);
    }

    panel.innerHTML =
      '<div class="acms-panel-header">' +
        '<span class="acms-panel-title">' + title + ' <span class="acms-lib-count" style="font-weight:normal;font-size:12px;color:#888;"></span></span>' +
        '<button class="acms-panel-close" type="button" title="关闭">×</button>' +
      '</div>' +
      // P200: 范围筛选（管理视图默认「全部」— 便于整理跨文档档案）
      '<div class="acms-lib-scope" style="display:flex;align-items:center;gap:6px;padding:10px 16px 0;font-size:12px;color:#666;flex-wrap:wrap;">' +
        '<span>范围：</span>' +
        '<button class="acms-lib-scope-btn" data-scope="all" type="button">全部</button>' +
        '<button class="acms-lib-scope-btn" data-scope="doc" type="button">本文档</button>' +
        '<button class="acms-lib-scope-btn" data-scope="unassigned" type="button">未绑定 <span class="acms-lib-scope-n">0</span></button>' +
        '<span style="color:#999;font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
          (acmsDocId ? ('· ' + acmsEscapeHtml(acmsDocName || '当前文档')) : '· 文档未保存') +
        '</span>' +
      '</div>' +
      '<div class="acms-lib-list" style="padding:8px 16px;"></div>' +
      '<div style="padding:8px 16px 14px;border-top:1px solid #f0f0f0;">' +
        '<button class="acms-lib-add" type="button" style="width:100%;padding:8px;background:#f5f5f5;border:1px dashed #bbb;border-radius:6px;font-size:13px;cursor:pointer;color:#555;font-family:inherit;">+ 新建' + itemWord + '档案</button>' +
      '</div>';

    document.body.appendChild(panel);
    // 位置：屏幕中央偏右
    var rect = panel.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    panel.style.left = Math.max(8, (vw - rect.width) / 2) + 'px';
    panel.style.top = Math.max(8, (vh - rect.height) / 2 - 30) + 'px';

    function closeBtn() { close(); }
    panel.querySelector('.acms-panel-close').onclick = closeBtn;
    setTimeout(function () {
      document.addEventListener('keydown', escHandler);
      document.addEventListener('mousedown', outsideHandler);
    }, 120);

    var listEl = panel.querySelector('.acms-lib-list');
    var countEl = panel.querySelector('.acms-lib-count');

    // P200: 范围筛选 —— 管理视图默认「全部」（管理界面要能看到并整理所有文档的档案）
    var mgrScope = 'all';
    var scopeBtns = panel.querySelectorAll('.acms-lib-scope-btn');
    function applyScopeBtnStyle(b, active) {
      b.style.cssText = active
        ? 'padding:3px 10px;border:1px solid #2196f3;background:#e3f2fd;border-radius:12px;font-size:12px;cursor:pointer;color:#0b62d6;font-weight:600;font-family:inherit;'
        : 'padding:3px 10px;border:1px solid #ddd;background:#fff;border-radius:12px;font-size:12px;cursor:pointer;color:#555;font-family:inherit;';
    }
    scopeBtns.forEach(function (b) {
      var sc = b.getAttribute('data-scope');
      if (sc === 'doc' && !acmsDocId) { b.disabled = true; b.title = '当前文档未保存，无法按文档筛选'; }
      applyScopeBtnStyle(b, sc === mgrScope);
      b.onclick = function () {
        if (b.disabled) return;
        mgrScope = sc;
        scopeBtns.forEach(function (x) { applyScopeBtnStyle(x, x.getAttribute('data-scope') === mgrScope); });
        reload();
      };
    });

    // 来源 badge：通用 / 本文档 / 其他文档 / 未绑定
    function srcBadgeOf(it) {
      if (it.shared === true) {
        return '<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10.5px;white-space:nowrap;background:#f3e5f5;color:#7b1fa2;border:1px solid #ce93d8;">🌐 通用</span>';
      }
      if (it.sourceDocId) {
        var isCur = it.sourceDocId === acmsDocId;
        return '<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10.5px;white-space:nowrap;' +
          (isCur ? 'background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;' : 'background:#f5f5f5;color:#888;border:1px solid #e0e0e0;') +
          '">📄 ' + acmsEscapeHtml(it.sourceDocName || '其他文档') + (isCur ? ' · 本文档' : '') + '</span>';
      }
      return '<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10.5px;white-space:nowrap;background:#fff8e6;color:#8a5a00;border:1px solid #ffe0a3;">⚠️ 未绑定</span>';
    }

    function reload() {
      if (!apiLib || !apiLib.list) {
        listEl.innerHTML = '<div class="acms-panel-chars-empty">' + itemWord + '库 API 未加载</div>';
        return;
      }
      apiLib.list(acmsDocId, mgrScope).then(function (resp) {
        var items = (resp && resp.data && resp.data[listKey]) || [];
        countEl.textContent = '（' + items.length + '）';
        // 顺带刷新「未绑定」计数
        apiLib.list(null, 'unassigned').then(function (r2) {
          var nEl = panel.querySelector('.acms-lib-scope-n');
          if (nEl) nEl.textContent = String(((r2 && r2.data && r2.data[listKey]) || []).length);
        }).catch(function () {});
        if (!items.length) {
          var emptyMsg = mgrScope === 'doc'
            ? ('本文档还没有' + itemWord + '档案。<br/>切到「全部」可看其他文档的，或点下方新建。')
            : (mgrScope === 'unassigned'
              ? ('没有未绑定文档的' + itemWord + '档案。')
              : ('还没有' + itemWord + '档案。<br/>点下方「+ 新建' + itemWord + '档案」创建，或在文档里右键 AI 生成的图 → 「存为' + itemWord + '参考」。'));
          listEl.innerHTML = '<div class="acms-panel-chars-empty">' + emptyMsg + '</div>';
          return;
        }
        listEl.innerHTML = items.map(function (it) {
          var thumb = it.referenceImage
            ? '<img class="acms-char-thumb" src="' + acmsEscapeHtml(it.referenceImage) + '" style="width:48px;height:48px;" alt=""/>'
            : '<span class="acms-char-thumb-empty" style="width:48px;height:48px;">无图</span>';
          var aliasStr = (it.aliases && it.aliases.length) ? '<span class="acms-char-alias">（' + acmsEscapeHtml(it.aliases.join('/')) + '）</span>' : '';
          // P200: 归属操作（三态）—— 通用 → 取消通用；本文档 → 设为通用；其他/未绑定 → 归到本文档
          var ownBtn = '';
          if (it.shared === true) {
            ownBtn = '<button class="acms-lib-unshare" type="button" title="取消通用：之后只在它所属文档里出现" style="background:#fff;border:1px solid #ce93d8;color:#7b1fa2;border-radius:4px;padding:4px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;">取消通用</button>';
          } else if (it.sourceDocId && it.sourceDocId === acmsDocId) {
            ownBtn = '<button class="acms-lib-share" type="button" title="设为通用：所有文档都能引用（适合跨作品复用的角色）" style="background:#fff;border:1px solid #ce93d8;color:#7b1fa2;border-radius:4px;padding:4px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;">设为通用</button>';
          } else if (acmsDocId) {
            ownBtn = '<button class="acms-lib-bind" type="button" title="把这条档案归到当前文档（之后换文档不会再出现）" style="background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32;border-radius:4px;padding:4px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;">归到本文档</button>';
          }
          return '<div class="acms-lib-item" data-id="' + it.id + '" style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;">' +
                   thumb +
                   '<div style="flex:1;min-width:0;">' +
                     '<div style="font-size:13px;font-weight:500;color:#222;">' + acmsEscapeHtml(it.name) + aliasStr + srcBadgeOf(it) + '</div>' +
                     (it.description ? '<div style="font-size:11.5px;color:#888;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + acmsEscapeHtml(it.description) + '</div>' : '') +
                   '</div>' +
                   ownBtn +
                   '<button class="acms-lib-edit" type="button" title="编辑" style="background:#f0f7ff;border:1px solid #90caf9;color:#1565c0;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer;font-family:inherit;">✏️</button>' +
                   '<button class="acms-lib-del" type="button" title="删除" style="background:#fff5f5;border:1px solid #ef9a9a;color:#c62828;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer;font-family:inherit;">🗑</button>' +
                 '</div>';
        }).join('');
        // 绑事件
        listEl.querySelectorAll('.acms-lib-item').forEach(function (row) {
          var id = row.getAttribute('data-id');
          var item = items.find(function (x) { return x.id === id; });
          if (!item) return;
          var bindBtn = row.querySelector('.acms-lib-bind');
          if (bindBtn) {
            bindBtn.onclick = function () {
              apiLib.assignDoc([item.id], acmsDocId, acmsDocName).then(function (r) {
                if (r && r.ok) { showAcmsToast('✅ 已归到本文档: ' + item.name, 'ok', 2000); reload(); }
                else { showAcmsToast('❌ ' + ((r && r.error) || '归属失败'), 'error'); }
              }).catch(function (e) { showAcmsToast('❌ ' + e.message, 'error'); });
            };
          }
          var shareBtn = row.querySelector('.acms-lib-share');
          if (shareBtn) {
            shareBtn.onclick = function () {
              apiLib.setShared([item.id], true).then(function (r) {
                if (r && r.ok) { showAcmsToast('🌐 已设为通用（所有文档可见）: ' + item.name, 'ok', 2200); reload(); }
                else { showAcmsToast('❌ ' + ((r && r.error) || '操作失败'), 'error'); }
              }).catch(function (e) { showAcmsToast('❌ ' + e.message, 'error'); });
            };
          }
          var unshareBtn = row.querySelector('.acms-lib-unshare');
          if (unshareBtn) {
            unshareBtn.onclick = function () {
              apiLib.setShared([item.id], false).then(function (r) {
                if (r && r.ok) { showAcmsToast('已取消通用: ' + item.name, 'ok', 2200); reload(); }
                else { showAcmsToast('❌ ' + ((r && r.error) || '操作失败'), 'error'); }
              }).catch(function (e) { showAcmsToast('❌ ' + e.message, 'error'); });
            };
          }
          row.querySelector('.acms-lib-edit').onclick = function () {
            showCharacterQuickCreatePanel({
              anchorPanel: panel,
              kind: kind,
              editItem: item,
              onCreated: function () { reload(); }
            });
          };
          row.querySelector('.acms-lib-del').onclick = function () {
            if (!window.confirm('确定删除' + itemWord + '「' + item.name + '」？此操作不可撤销。')) return;
            apiLib.remove(item.id).then(function (r) {
              if (r && r.ok) {
                showAcmsToast('✅ 已删除: ' + item.name, 'ok', 1800);
                reload();
              } else {
                showAcmsToast('❌ ' + ((r && r.error) || '删除失败'), 'error');
              }
            }).catch(function (e) { showAcmsToast('❌ ' + e.message, 'error'); });
          };
        });
      }).catch(function (e) {
        listEl.innerHTML = '<div class="acms-panel-chars-empty">加载失败: ' + acmsEscapeHtml(e.message) + '</div>';
      });
    }

    reload();

    panel.querySelector('.acms-lib-add').onclick = function () {
      showCharacterQuickCreatePanel({
        anchorPanel: panel,
        kind: kind,
        onCreated: function () { reload(); }
      });
    };

    return { close: close, reload: reload };
  }

  // ══════════════════════════════════════════════════════════════
  // P200: 视觉设定集（Visual Bible）— 全文抽取人物/场景 → 设定图 → 一致性基准
  //   流程：抽全文 → SSE 分析 → 确认卡（可编辑）→ 串行生成设定图 → 入库 → 结果卡（可🎲换图）
  // ══════════════════════════════════════════════════════════════

  function acmsInjectBibleCss() {
    if (document.getElementById('acms-bible-css')) return;
    acmsInjectImagePanelCss();
    var style = document.createElement('style');
    style.id = 'acms-bible-css';
    style.textContent =
      '@keyframes acmsBiblePulse { 0% { box-shadow:0 0 0 0 rgba(156,39,176,.5);} 70% { box-shadow:0 0 0 14px rgba(156,39,176,0);} 100% { box-shadow:0 0 0 0 rgba(156,39,176,0);} }' +
      '#acms-bible-progress, #acms-bible-confirm, #acms-bible-result { animation: acmsBiblePulse .45s ease-out; }' +
      '.acms-bible-overlay { position:fixed;left:50%;transform:translateX(-50%);z-index:100002;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;border:2px solid rgba(156,39,176,.45); }' +
      '.acms-bible-overlay .acms-bible-head { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee; }' +
      '.acms-bible-overlay .acms-bible-title { font-size:14px;font-weight:600;color:#222; }' +

  // ── 确认卡：设定集草案（可编辑）──
  function showVisualBibleConfirmPanel(bible, opts) {

    var old = document.getElementById('acms-bible-confirm');
    if (old) old.remove();
    var chars = (bible.characters || []).map(function (c) {

    });

    function statsLine() {

          '<div class="acms-bi-main">' +
            '<input type="text" class="acms-bi-name" value="' + acmsEscapeHtml(s.name) + '"/>' +
            '<textarea class="acms-bi-prompt" rows="2">' + acmsEscapeHtml(s.prompt) + '</textarea>' +

          '<button class="acms-bi-del" type="button">删</button>' +

          '<span class="acms-bible-title">🎬 视觉设定集草案</span>' +
          '<button class="acms-bible-x" type="button" title="关闭">×</button>' +

        (chars.length ? '<div class="acms-bible-sec">🎭 人物（' + chars.length + '）</div><div style="padding:0 16px;">' + chHtml + '</div>' : '') +
        (scenes.length ? '<div class="acms-bible-sec">🏞️ 场景（' + scenes.length + '）</div><div style="padding:0 16px 4px;">' + scHtml + '</div>' : '') +
        '<div class="acms-bible-sec">🎨 统一风格</div>' +
        '<div style="padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:6px;">' +
          ACMS_IMAGE_STYLES.map(function (s, i) {
            return '<button class="acms-style-chip' + (i === 0 ? ' active' : '') + '" data-style="' + s.key + '" type="button" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:16px;font-size:12px;cursor:pointer;font-family:inherit;">' +
              '<span>' + s.icon + '</span><span>' + s.label + '</span></button>';
          }).join('') +
        '</div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;padding:8px 16px 14px;border-top:1px solid #f0f0f0;">' +
          '<button class="acms-bible-cancel" type="button" style="padding:7px 16px;background:#f5f5f5;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;">取消</button>' +
          '<button class="acms-bible-go" type="button" style="padding:7px 16px;background:#9c27b0;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit;">✅ 生成设定图</button>' +
        '</div>';

      // 事件
      panel.querySelector('.acms-bible-x').onclick = close;
      panel.querySelector('.acms-bible-cancel').onclick = close;
      var selStyle = ACMS_IMAGE_STYLES[0].key;
      panel.querySelectorAll('.acms-style-chip').forEach(function (chip) {
        chip.onclick = function () {
          panel.querySelectorAll('.acms-style-chip').forEach(function (c) { c.classList.remove('active'); c.style.background = '#f5f5f5'; c.style.color = '#333'; c.style.borderColor = '#e0e0e0'; });
          chip.classList.add('active');
          chip.style.background = '#2196f3'; chip.style.color = '#fff'; chip.style.borderColor = '#2196f3';
          selStyle = chip.getAttribute('data-style');
        };
      });
      // 默认第一个高亮
      var first = panel.querySelector('.acms-style-chip');
      if (first) { first.style.background = '#2196f3'; first.style.color = '#fff'; first.style.borderColor = '#2196f3'; }

      panel.querySelectorAll('.acms-bible-item').forEach(function (row) {
        var kind = row.getAttribute('data-kind');
        var idx = parseInt(row.getAttribute('data-idx'), 10);

        row.querySelector('input[type=checkbox]').onchange = function () { arr[idx].on = this.checked; };
        row.querySelector('.acms-bi-name').oninput = function () { arr[idx].name = this.value.trim() || arr[idx].name; };
        row.querySelector('.acms-bi-prompt').oninput = function () { arr[idx].prompt = this.value; };
        row.querySelector('.acms-bi-del').onclick = function () {
          row.remove();
          arr[idx]._deleted = true;
          updateGoLabel();
        };
      });

      function updateGoLabel() {
        var n = chars.filter(function (c) { return c.on && !c._deleted; }).length +
                scenes.filter(function (s) { return s.on && !s._deleted; }).length;
        panel.querySelector('.acms-bible-go').textContent = '✅ 生成设定图（' + n + ' 张）';
      }
      panel.querySelectorAll('input[type=checkbox]').forEach(function (cb) { cb.onchange = function () { cb.__orig && cb.__orig(); updateGoLabel(); }; });
      // 重新绑定 checkbox（保留上面的 handler 语义）
      panel.querySelectorAll('.acms-bible-item').forEach(function (row) {
        var kind = row.getAttribute('data-kind');
        var idx = parseInt(row.getAttribute('data-idx'), 10);
        var arr = kind === 'character' ? chars : scenes;
        var cb = row.querySelector('input[type=checkbox]');
        cb.onchange = function () { arr[idx].on = this.checked; updateGoLabel(); };
      });

      panel.querySelector('.acms-bible-go').onclick = function () {
        // 收集确认后的设定集
        var out = {
          characters: chars.filter(function (c) { return c.on && !c._deleted; }).map(function (c) {
            return { name: c.name, aliases: c.aliases, description: c.description, imagePrompt: c.prompt };
          }),
          scenes: scenes.filter(function (s) { return s.on && !s._deleted; }).map(function (s) {
            return { name: s.name, aliases: s.aliases, description: s.description, imagePrompt: s.prompt };
          })
        };
        var styleObj = null;
        for (var i = 0; i < ACMS_IMAGE_STYLES.length; i++) {
          if (ACMS_IMAGE_STYLES[i].key === selStyle) { styleObj = ACMS_IMAGE_STYLES[i]; break; }
        }
        close();
        if (opts.onConfirm) opts.onConfirm(out, styleObj);
      };
      updateGoLabel();
    }

    function close() { panel.remove(); }
    document.body.appendChild(panel);
    renderList();
    return { close: close };
  }

              '<div class="acms-bri-info"><b>' + acmsEscapeHtml(r.name) + '</b> <span style="color:#999;font-size:11px;">' + (r.kind === 'scene' ? '场景' : '角色') + '</span><br/>' +

            '</div>';
